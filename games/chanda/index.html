<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Room Runner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a202c; /* Tailwind gray-900 */
            touch-action: none; /* Prevent browser scrolling on swipe */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to game */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            box-sizing: border-box;
        }
        .interactive-ui {
            pointer-events: auto;
        }
        /* Custom animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-custom {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="ui-layer">
        <!-- Danger Overlay -->
        <div id="danger-overlay" class="absolute inset-0 pointer-events-none transition-opacity duration-200 opacity-0 z-10" 
             style="box-shadow: inset 0 0 100px 50px rgba(239, 68, 68, 0.6);">
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden flex justify-between items-start w-full">
            <div class="bg-white/90 backdrop-blur-sm p-3 rounded-xl shadow-lg border-2 border-slate-200">
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">Score</div>
                <div id="score-display" class="text-2xl font-black text-indigo-600">0</div>
            </div>
            
            <div class="bg-white/90 backdrop-blur-sm p-3 rounded-xl shadow-lg border-2 border-slate-200 flex flex-col items-end">
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">Helper Fund</div>
                <div id="helper-score-display" class="text-xl font-bold text-green-600">0</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="interactive-ui absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-md z-50">
            <h1 class="text-5xl md:text-6xl font-black text-white mb-2 drop-shadow-lg tracking-tighter">ROOM<span class="text-indigo-400">RUNNER</span></h1>
            <p class="text-slate-300 mb-8 text-center max-w-md px-4">Swipe to move. Collect tokens. Avoid security.</p>
            
            <button id="start-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 px-12 rounded-full shadow-lg transform transition active:scale-95 text-xl">
                PLAY NOW
            </button>
            
            <div class="mt-8 text-slate-400 text-sm">
                High Score: <span id="high-score" class="text-white font-bold">0</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden interactive-ui absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 backdrop-blur-md z-50">
            <h2 class="text-5xl font-black text-white mb-2">BUSTED!</h2>
            <p class="text-red-200 mb-6">The security caught you.</p>
            
            <div class="bg-white/10 p-6 rounded-2xl mb-8 text-center backdrop-blur-sm border border-white/20 w-64">
                <div class="text-slate-300 text-sm uppercase">Final Score</div>
                <div id="final-score" class="text-4xl font-bold text-white mb-2">0</div>
                <div class="w-full h-px bg-white/20 my-2"></div>
                <div class="text-green-300 text-sm">Helper: <span id="final-helper">0</span></div>
            </div>
            
            <button id="restart-btn" class="bg-white text-red-600 font-bold py-3 px-10 rounded-full shadow-xl transform transition active:scale-95 text-lg">
                TRY AGAIN
            </button>
        </div>
        
        <!-- Controls Hint -->
        <div id="controls-hint" class="hidden absolute bottom-10 left-0 w-full text-center pointer-events-none">
            <p class="text-white/50 text-sm font-medium animate-pulse-custom">Swipe to move</p>
        </div>
    </div>

    <script>
        // Game Configuration
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            backgroundColor: '#e2e8f0', // Slate-200
            scale: {
                mode: Phaser.Scale.RESIZE,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: {
                    debug: false,
                    gravity: { y: 0 }
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        // Global Game Variables
        let game;
        let player;
        let cursors;
        let score = 0;
        let helperScore = 0;
        let isGameOver = false;
        let isPlaying = false;
        let npcs;
        let enemies;
        let obstacles;
        let helper;
        let gridSize = 60; // Size of movement grid
        let moveSpeed = 120; // Slightly faster
        let canMove = true;
        let canMove = true;
        let level = 1;
        let spawnTimer;

        // Sound Synthesizer (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'coin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'transfer') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Initialize UI Logic
        window.onload = function() {
            const storedHighScore = localStorage.getItem('roomRunnerHighScore') || 0;
            document.getElementById('high-score').textContent = storedHighScore;

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('controls-hint').classList.remove('hidden');
                
                // Initialize Phaser Game if not already
                if (!game) {
                    game = new Phaser.Game(config);
                } else {
                    game.scene.getScene('default').scene.restart();
                }
                
                isPlaying = true;
                setTimeout(() => {
                    document.getElementById('controls-hint').classList.add('hidden');
                }, 3000);
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                game.scene.getScene('default').scene.restart();
                isPlaying = true;
            });
        };

        // Phaser Functions
        function preload() {
            // Generate Textures programmatically
            const graphics = this.make.graphics({ x: 0, y: 0, add: false });
            
            // Player Texture
            graphics.clear();
            graphics.fillStyle(0x4F46E5, 1); // Indigo
            graphics.fillCircle(30, 30, 25);
            graphics.fillStyle(0xffffff, 1);
            graphics.fillCircle(30, 20, 8); // Highlight
            graphics.generateTexture('player', 60, 60);
            
            // NPC Texture
            graphics.clear();
            graphics.fillStyle(0x10B981, 1); // Emerald
            graphics.fillRoundedRect(10, 10, 40, 40, 10);
            graphics.generateTexture('npc', 60, 60);

            // Helper Texture
            graphics.clear();
            graphics.fillStyle(0x3B82F6, 1); // Blue
            graphics.fillStar(30, 30, 5, 15, 25);
            graphics.generateTexture('helper', 60, 60);

            // Enemy Texture
            graphics.clear();
            graphics.fillStyle(0xEF4444, 1); // Red
            graphics.beginPath();
            graphics.moveTo(30, 10);
            graphics.lineTo(50, 50);
            graphics.lineTo(10, 50);
            graphics.closePath();
            graphics.fillPath();
            // Eye
            graphics.fillStyle(0xffffff, 1);
            graphics.fillCircle(30, 30, 8);
            graphics.fillStyle(0x000000, 1);
            graphics.fillCircle(30, 30, 3);
            graphics.generateTexture('enemy', 60, 60);
            
            // Obstacle Texture (Table)
            graphics.clear();
            graphics.fillStyle(0x78350f, 1); // Brown
            graphics.fillRoundedRect(0, 0, 60, 60, 5);
            graphics.fillStyle(0x92400e, 1); // Light Brown Top
            graphics.fillRect(5, 5, 50, 50);
            graphics.generateTexture('obstacle', 60, 60);

            // Floor Tile
            graphics.clear();
            graphics.fillStyle(0xf1f5f9, 1); // Slate-100
            graphics.fillRect(0, 0, 60, 60);
            graphics.lineStyle(2, 0xe2e8f0, 1); // Slate-200
            graphics.strokeRect(0, 0, 60, 60);
            graphics.generateTexture('floor', 60, 60);
        }

        function create() {
            score = 0;
            helperScore = 0;
            isGameOver = false;
            level = 1;
            canMove = true;
            updateUI();

            // Background
            this.add.tileSprite(this.scale.width/2, this.scale.height/2, this.scale.width, this.scale.height, 'floor');

            // Groups
            obstacles = this.physics.add.staticGroup();
            npcs = this.physics.add.group();
            enemies = this.physics.add.group();

            // Grid Calculations
            const cols = Math.floor(this.scale.width / gridSize);
            const rows = Math.floor(this.scale.height / gridSize);

            // Generate Obstacles (Random clusters)
            for (let c = 1; c < cols - 1; c++) {
                for (let r = 1; r < rows - 1; r++) {
                    if (Math.random() < 0.15) { // 15% chance of wall
                        // Keep center clear for player
                        if (Math.abs(c - cols/2) < 2 && Math.abs(r - rows/2) < 2) continue;
                        obstacles.create(c * gridSize + gridSize/2, r * gridSize + gridSize/2, 'obstacle');
                    }
                }
            }

            // Create Player in center
            const startX = Math.floor(cols / 2) * gridSize + gridSize/2;
            const startY = Math.floor(rows / 2) * gridSize + gridSize/2;
            
            player = this.physics.add.sprite(startX, startY, 'player');
            player.setDepth(10);
            player.setCollideWorldBounds(true);
            player.body.setCircle(15, 15, 15);

            // Collisions
            this.physics.add.collider(player, obstacles);
            this.physics.add.collider(enemies, obstacles);
            this.physics.add.overlap(player, npcs, collectToken, null, this);
            this.physics.add.overlap(player, enemies, hitEnemy, null, this);

            // Input
            this.input.on('pointerup', handleSwipe, this);
            
            // Spawning
            spawnEntities(this);
            
            spawnTimer = this.time.addEvent({
                delay: 4000,
                callback: spawnEnemy,
                callbackScope: this,
                loop: true
            });

            // Score over time
            this.time.addEvent({
                delay: 1000,
                callback: () => {
                    if (!isGameOver && isPlaying) {
                        score += 1;
                        updateUI();
                    }
                },
                loop: true
            });
        }

        function update() {
            if (isGameOver) return;
            
            // Keep labels synced with NPCs
            npcs.children.iterate((npc) => {
                const label = npc.getData('label');
                if (label) label.setPosition(npc.x, npc.y - 30);
            });

            // Danger Proximity Check
            let minDistance = Infinity;
            enemies.children.iterate((enemy) => {
                if (enemy) {
                    const dist = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y);
                    if (dist < minDistance) minDistance = dist;
                    
                    // Simple steering towards player if very close (Chase)
                    if (dist < 200) {
                        const angle = Phaser.Math.Angle.Between(enemy.x, enemy.y, player.x, player.y);
                        // Nudge velocity towards player
                        enemy.body.velocity.x += Math.cos(angle) * 2;
                        enemy.body.velocity.y += Math.sin(angle) * 2;
                    }
                }
            });

            const dangerOverlay = document.getElementById('danger-overlay');
            if (minDistance < 250) {
                // Opacity inversely proportional to distance
                const opacity = 1 - (minDistance / 250);
                dangerOverlay.style.opacity = Math.min(opacity, 0.8);
            } else {
                dangerOverlay.style.opacity = 0;
            }
        }

        function isTileFree(scene, x, y) {
            // Check boundaries
            if (x < 0 || x > scene.scale.width || y < 0 || y > scene.scale.height) return false;
            
            // Check obstacles
            let free = true;
            obstacles.children.iterate(obs => {
                if (obs && Phaser.Math.Distance.Between(x, y, obs.x, obs.y) < gridSize/2) {
                    free = false;
                }
            });
            return free;
        }

        function handleSwipe(pointer) {
            if (isGameOver || !canMove) return;

            const swipeThreshold = 30;
            const diffX = pointer.upX - pointer.downX;
            const diffY = pointer.upY - pointer.downY;
            let targetX = player.x;
            let targetY = player.y;
            let moved = false;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > swipeThreshold) {
                    targetX += (diffX > 0) ? gridSize : -gridSize;
                    moved = true;
                }
            } else {
                if (Math.abs(diffY) > swipeThreshold) {
                    targetY += (diffY > 0) ? gridSize : -gridSize;
                    moved = true;
                }
            }

            if (moved) {
                const scene = game.scene.scenes[0];
                if (isTileFree(scene, targetX, targetY)) {
                    canMove = false;
                    playSound('move');
                    scene.tweens.add({
                        targets: player,
                        x: targetX,
                        y: targetY,
                        duration: moveSpeed,
                        ease: 'Power2',
                        onComplete: () => { canMove = true; }
                    });
                } else {
                    // Bump effect
                    scene.tweens.add({
                        targets: player,
                        x: player.x + (targetX - player.x) * 0.2,
                        y: player.y + (targetY - player.y) * 0.2,
                        duration: 50,
                        yoyo: true,
                        onComplete: () => { canMove = true; }
                    });
                }
            }
        }

        function getRandomFreePos(scene) {
            let x, y, free = false, attempts = 0;
            const cols = Math.floor(scene.scale.width / gridSize);
            const rows = Math.floor(scene.scale.height / gridSize);
            
            while (!free && attempts < 50) {
                x = Phaser.Math.Between(1, cols-1) * gridSize + gridSize/2;
                y = Phaser.Math.Between(1, rows-1) * gridSize + gridSize/2;
                free = isTileFree(scene, x, y) && 
                       Phaser.Math.Distance.Between(x, y, player.x, player.y) > gridSize * 3;
                attempts++;
            }
            return { x, y };
        }

        function spawnEntities(scene) {
            const pos = getRandomFreePos(scene);
            helper = scene.physics.add.staticSprite(pos.x, pos.y, 'helper');
            scene.physics.add.overlap(player, helper, transferTokens, null, scene);

            // Add text to helper
            const label = scene.add.text(pos.x, pos.y - 30, 'HELPER', {
                fontFamily: 'Arial', fontSize: '12px', fontStyle: 'bold', color: '#ffffff'
            }).setOrigin(0.5).setStroke('#000000', 3);

            for(let i=0; i<6; i++) spawnNPC(scene);
        }

        function spawnNPC(scene) {
            const pos = getRandomFreePos(scene);
            const npc = npcs.create(pos.x, pos.y, 'npc');
            const color = Phaser.Math.RND.pick([0xFCD34D, 0xF87171, 0x60A5FA, 0x34D399, 0xA78BFA]);
            npc.setTint(color);
            npc.body.setCircle(20);
            
            // Roles
            const roles = ['Vendor', 'Clerk', 'Citizen', 'Artist', 'Cook'];
            const role = Phaser.Math.RND.pick(roles);
            
            const label = scene.add.text(pos.x, pos.y - 30, role, {
                fontFamily: 'Arial', fontSize: '10px', color: '#ffffff'
            }).setOrigin(0.5).setStroke('#000000', 2);
            
            npc.setData('label', label);
        }

        function spawnEnemy() {
            if (isGameOver) return;
            const scene = game.scene.getScene('default');
            
            // Spawn away from player
            let x, y;
            if (Math.random() > 0.5) {
                x = Math.random() > 0.5 ? gridSize/2 : scene.scale.width - gridSize/2;
                y = Phaser.Math.Between(0, scene.scale.height);
            } else {
                x = Phaser.Math.Between(0, scene.scale.width);
                y = Math.random() > 0.5 ? gridSize/2 : scene.scale.height - gridSize/2;
            }

            const enemy = enemies.create(x, y, 'enemy');
            enemy.setVelocity(Phaser.Math.Between(-80, 80), Phaser.Math.Between(-80, 80));
            enemy.setBounce(1);
            enemy.setCollideWorldBounds(true);
            enemy.body.setCircle(18, 12, 12);
            
            // Increase difficulty
            const speedMult = 1 + (score/1000);
            enemy.body.velocity.scale(speedMult);
        }

        function collectToken(player, npc) {
            playSound('coin');
            
            // Visual effect
            const particles = npc.scene.add.particles(npc.x, npc.y, 'npc', {
                speed: 100,
                scale: { start: 0.5, end: 0 },
                blendMode: 'ADD',
                lifespan: 300
            });
            setTimeout(() => particles.destroy(), 300);

            // Relocate NPC to free spot
            const pos = getRandomFreePos(npc.scene);
            npc.setPosition(pos.x, pos.y);
            npc.setTint(Phaser.Math.RND.pick([0xFCD34D, 0xF87171, 0x60A5FA, 0x34D399, 0xA78BFA]));

            // Update Label
            const label = npc.getData('label');
            if (label) {
                label.setPosition(pos.x, pos.y - 30);
                // Change role randomly for fun?
                const roles = ['Vendor', 'Clerk', 'Citizen', 'Artist', 'Cook', 'Driver', 'Nurse'];
                label.setText(Phaser.Math.RND.pick(roles));
            }

            score += 10;
            updateUI();
            
            // Small score float animation
            const scoreText = npc.scene.add.text(npc.x, npc.y, '+10', {
                fontSize: '20px', fontStyle: 'bold', color: '#fbbf24'
            }).setOrigin(0.5);
            npc.scene.tweens.add({
                targets: scoreText,
                y: scoreText.y - 50,
                alpha: 0,
                duration: 800,
                onComplete: () => scoreText.destroy()
            });
        }

        function transferTokens(player, helper) {
            if (score > 0) {
                playSound('transfer');
                const transferAmount = Math.ceil(score * 0.5);
                helperScore += transferAmount;
                score -= transferAmount;
                
                // Helper animation
                helper.scene.tweens.add({
                    targets: helper,
                    scale: 1.5,
                    duration: 100,
                    yoyo: true
                });
                
                updateUI();
            }
        }

        function hitEnemy(player, enemy) {
            if (isGameOver) return;
            
            playSound('hit');
            isGameOver = true;
            player.setTint(0xff0000);
            
            // Screen Shake
            enemy.scene.cameras.main.shake(500, 0.05);
            
            // Save High Score
            const totalScore = score + helperScore;
            const currentHigh = parseInt(localStorage.getItem('roomRunnerHighScore') || '0');
            if (totalScore > currentHigh) {
                localStorage.setItem('roomRunnerHighScore', totalScore);
            }

            setTimeout(() => {
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').textContent = totalScore;
                document.getElementById('final-helper').textContent = helperScore;
            }, 1000);
        }

        function updateUI() {
            document.getElementById('score-display').textContent = score;
            document.getElementById('helper-score-display').textContent = helperScore;
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            if(game) {
                game.scale.resize(window.innerWidth, window.innerHeight);
            }
        });

    </script>
</body>
</html>
