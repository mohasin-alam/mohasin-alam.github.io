<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Connect 4 | Offline Arcade</title>
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Futuristic Neon Connect 4 Game with AI">
    <style>
        /* --- 1. CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #050505;
            --board-bg: #111;
            --neon-cyan: #00f3ff;   /* Player 1 */
            --neon-magenta: #ff00ff; /* Player 2 / AI */
            --neon-green: #0aff0a;
            --neon-red: #ff3333;
            --text-color: #fff;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --cell-size: clamp(40px, 13vw, 80px); /* Responsive sizing */
            --gap: 8px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* --- 2. HEADER & UI --- */
        header {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            background: rgba(255, 255, 255, 0.02);
        }

        h1.title {
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            animation: flicker 4s infinite alternate;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid #333;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .status-badge.online {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 5px var(--neon-green);
        }
        .status-badge.offline {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 5px var(--neon-red);
        }

        /* --- SCOREBOARD --- */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
            max-width: 500px;
        }

        .score-box {
            text-align: center;
            padding: 10px;
            min-width: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1px solid #333;
        }
        .score-box.active {
            border-color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .p1-score { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
        .p2-score { color: var(--neon-magenta); text-shadow: 0 0 5px var(--neon-magenta); }

        .score-val { font-size: 1.5rem; font-weight: bold; display: block; }
        .score-label { font-size: 0.8rem; opacity: 0.8; }

        /* --- 3. GAME BOARD --- */
        .game-board-container {
            position: relative;
            padding: 15px;
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid var(--neon-cyan);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, var(--cell-size));
            grid-template-rows: repeat(6, var(--cell-size));
            gap: var(--gap);
            background: var(--board-bg);
            padding: var(--gap);
            border-radius: 10px;
            position: relative;
        }

        /* The Slots */
        .cell {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05); /* Empty slot look */
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
            cursor: pointer;
            position: relative;
            z-index: 2; /* Clickable layer */
        }
        
        /* Column Highlight on Hover */
        .board:hover .cell:hover::after {
            content: '';
            position: absolute;
            top: -1000%; left: 0; right: 0; bottom: -1000%;
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 1;
        }

        /* The Discs */
        .disc {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 50%;
            z-index: 1; /* Behind cell mask but visible */
            top: 0; /* Animated by JS */
            left: 0;
            transition: transform 0.5s cubic-bezier(0.5, 0, 0.5, 1);
        }

        .disc.p1 {
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset -2px -2px 5px rgba(0,0,0,0.5);
        }
        .disc.p2 {
            background: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta), inset -2px -2px 5px rgba(0,0,0,0.5);
        }

        /* Winning Line */
        .cell.win-highlight {
            border: 2px solid #fff;
            animation: pulse 1s infinite;
        }

        /* --- 4. OVERLAYS --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease-out;
        }
        .overlay.active { display: flex; }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 40px;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: 0.2s;
            min-width: 200px;
        }
        .btn:hover, .btn:active {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        .btn-secondary {
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
        }
        .btn-secondary:hover {
            background: var(--neon-magenta);
            color: #000;
            box-shadow: 0 0 25px var(--neon-magenta);
        }

        input[type="text"] {
            background: transparent;
            border: 2px solid #555;
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            width: 80%;
            max-width: 300px;
        }
        input[type="text"]:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

        /* --- 5. FOOTER & CONTROLS --- */
        .controls-area { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn-small { padding: 8px 15px; font-size: 0.9rem; min-width: auto; }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            width: 100%;
            border-top: 1px solid #222;
        }
        .dev-credit { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 5px rgba(10, 255, 10, 0.3); }

        /* ANIMATIONS */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.5; }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 rgba(255,255,255,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,255,255,0.8); }
            100% { box-shadow: 0 0 0 rgba(255,255,255,0.5); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <header>
        <h1 class="title">CONNECT 4</h1>
        <div id="net-status" class="status-badge">Checking...</div>
    </header>

    <div class="scoreboard">
        <div class="score-box active" id="p1-box">
            <span class="score-val p1-score" id="score-p1">0</span>
            <span class="score-label" id="name-p1">Player</span>
        </div>
        <div class="score-box">
            <span class="score-val" id="score-draw" style="color:#aaa">0</span>
            <span class="score-label">Draws</span>
        </div>
        <div class="score-box" id="p2-box">
            <span class="score-val p2-score" id="score-p2">0</span>
            <span class="score-label" id="name-p2">CPU</span>
        </div>
    </div>

    <div class="game-board-container">
        <!-- Discs Layer -->
        <div id="disc-layer" style="position: absolute; top:0; left:0; width:100%; height:100%;"></div>
        
        <!-- Grid Layer (Cells) -->
        <div class="board" id="grid">
            <!-- 42 Cells generated by JS -->
        </div>
    </div>

    <div class="controls-area">
        <button class="btn btn-small" onclick="Game.restartRound()">Restart Round</button>
        <button class="btn btn-small btn-secondary" onclick="Game.showMenu()">Menu</button>
    </div>

    <!-- SCREENS -->
    <div id="start-screen" class="overlay active">
        <h2 style="color:var(--neon-cyan); margin-bottom:10px;">WELCOME</h2>
        <input type="text" id="player-name-input" placeholder="Enter Name" maxlength="10">
        
        <p style="color:#aaa; margin-top:20px;">SELECT MODE</p>
        <button class="btn" onclick="Game.startGame('pve')">Player vs AI</button>
        <button class="btn btn-secondary" onclick="Game.startGame('pvp')">Player vs Player</button>
        
        <button class="btn btn-small" style="margin-top:30px; border-color:#555; color:#aaa;" onclick="Game.resetData()">Reset Data</button>
    </div>

    <div id="game-over-screen" class="overlay">
        <h2 id="result-title" style="font-size: 2.5rem; text-transform: uppercase;">WINNER</h2>
        <p id="result-msg" style="color:#ddd; margin-bottom: 20px;">-</p>
        <button class="btn" onclick="Game.restartRound()">Play Again</button>
        <button class="btn btn-secondary" onclick="Game.showMenu()">Change Mode</button>
    </div>

    <footer>
        Developed by:<br>
        <span class="dev-credit">Csm Mohasin Alam</span>
    </footer>

    <script>
        /**
         * NEON CONNECT 4 ENGINE
         * Pure JS, Offline, Responsive, AI
         */
        const Game = (() => {
            // Configuration
            const ROWS = 6;
            const COLS = 7;
            
            // State
            const state = {
                board: [], // 2D Array [row][col]
                currentPlayer: 1, // 1 or 2
                mode: 'pve', // 'pvp' or 'pve'
                gameActive: false,
                isDropping: false, // Animation lock
                scores: { p1: 0, p2: 0, draws: 0 },
                names: { p1: 'Player', p2: 'NEON AI' }
            };

            // DOM Elements
            const els = {
                grid: document.getElementById('grid'),
                discLayer: document.getElementById('disc-layer'),
                startScreen: document.getElementById('start-screen'),
                gameOverScreen: document.getElementById('game-over-screen'),
                resultTitle: document.getElementById('result-title'),
                resultMsg: document.getElementById('result-msg'),
                nameInput: document.getElementById('player-name-input'),
                scoreP1: document.getElementById('score-p1'),
                scoreP2: document.getElementById('score-p2'),
                scoreDraw: document.getElementById('score-draw'),
                nameP1: document.getElementById('name-p1'),
                nameP2: document.getElementById('name-p2'),
                boxP1: document.getElementById('p1-box'),
                boxP2: document.getElementById('p2-box'),
                netStatus: document.getElementById('net-status')
            };

            // --- 1. INITIALIZATION ---
            function init() {
                loadData();
                setupNetwork();
                setupGrid();
                
                // Pre-fill name if saved
                if(state.names.p1 && state.names.p1 !== 'Player') {
                    els.nameInput.value = state.names.p1;
                }
            }

            function setupGrid() {
                els.grid.innerHTML = '';
                for(let c = 0; c < COLS * ROWS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    const colIdx = c % COLS;
                    // Add click listener to the cell (acts as clicking the column)
                    cell.addEventListener('click', () => handleColumnClick(colIdx));
                    els.grid.appendChild(cell);
                }
            }

            // --- 2. GAME FLOW ---
            function startGame(mode) {
                state.mode = mode;
                const inputName = els.nameInput.value.trim();
                state.names.p1 = inputName || "Player 1";
                state.names.p2 = mode === 'pve' ? "NEON AI" : "Player 2";
                
                saveData();
                updateScoreboardUI();
                
                els.startScreen.classList.remove('active');
                restartRound();
            }

            function restartRound() {
                // Reset Board Logic
                state.board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
                state.currentPlayer = 1;
                state.gameActive = true;
                state.isDropping = false;

                // Reset UI
                els.discLayer.innerHTML = '';
                els.gameOverScreen.classList.remove('active');
                document.querySelectorAll('.cell').forEach(c => c.classList.remove('win-highlight'));
                
                highlightTurn();
            }

            function showMenu() {
                els.gameOverScreen.classList.remove('active');
                els.startScreen.classList.add('active');
            }

            // --- 3. LOGIC ---
            function handleColumnClick(col) {
                if (!state.gameActive || state.isDropping) return;
                
                // In PVE, prevent Player 1 from clicking if it's AI turn
                if (state.mode === 'pve' && state.currentPlayer === 2) return;

                attemptDrop(col);
            }

            function attemptDrop(col) {
                // Find lowest empty row
                let rowToDrop = -1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (state.board[r][col] === 0) {
                        rowToDrop = r;
                        break;
                    }
                }

                if (rowToDrop === -1) return; // Column full

                // Execute Move
                state.isDropping = true;
                const player = state.currentPlayer;
                
                // Animation & Logic
                animateDrop(rowToDrop, col, player, () => {
                    // After Animation
                    state.board[rowToDrop][col] = player;
                    
                    if (checkWin(rowToDrop, col, player)) {
                        endGame(player);
                    } else if (checkDraw()) {
                        endGame('draw');
                    } else {
                        // Switch Turn
                        state.currentPlayer = player === 1 ? 2 : 1;
                        state.isDropping = false;
                        highlightTurn();

                        // Trigger AI if needed
                        if (state.mode === 'pve' && state.currentPlayer === 2) {
                            setTimeout(aiTurn, 600); // Thinking delay
                        }
                    }
                });
            }

            function animateDrop(row, col, player, callback) {
                // Create Disc Element
                const disc = document.createElement('div');
                disc.classList.add('disc', player === 1 ? 'p1' : 'p2');
                
                // Calculations for position
                // We rely on CSS Variables and fixed grid math for simplicity
                // Using offsetLeft/Top from a reference cell is safer for responsiveness
                const cells = document.querySelectorAll('.cell');
                const targetCellIndex = (row * COLS) + col;
                const targetCell = cells[targetCellIndex];
                
                // Grid wrapper padding/gap consideration
                // Simplest: Position absolute relative to grid container
                const gridRect = els.grid.getBoundingClientRect();
                const cellRect = targetCell.getBoundingClientRect();
                
                const left = cellRect.left - gridRect.left;
                const finalTop = cellRect.top - gridRect.top;
                
                // Start above the board
                disc.style.left = `${left}px`;
                disc.style.transform = `translateY(-60px)`; 
                
                els.discLayer.appendChild(disc); // Add to DOM

                // Force reflow
                disc.offsetHeight;

                // Animate
                disc.style.transform = `translateY(${finalTop}px)`;

                // Wait for CSS transition (0.5s)
                setTimeout(() => {
                    callback();
                }, 500);
            }

            // --- 4. WIN LOGIC ---
            function checkWin(r, c, player) {
                // Directions: [dRow, dCol]
                const directions = [
                    [0, 1],  // Horizontal
                    [1, 0],  // Vertical
                    [1, 1],  // Diag Down-Right
                    [1, -1]  // Diag Down-Left
                ];

                for (let [dr, dc] of directions) {
                    let count = 1;
                    let winningCells = [[r, c]];

                    // Check Positive Direction
                    for (let i = 1; i < 4; i++) {
                        const nr = r + dr * i;
                        const nc = c + dc * i;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && state.board[nr][nc] === player) {
                            count++;
                            winningCells.push([nr, nc]);
                        } else break;
                    }
                    // Check Negative Direction
                    for (let i = 1; i < 4; i++) {
                        const nr = r - dr * i;
                        const nc = c - dc * i;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && state.board[nr][nc] === player) {
                            count++;
                            winningCells.push([nr, nc]);
                        } else break;
                    }

                    if (count >= 4) {
                        highlightWinningCells(winningCells);
                        return true;
                    }
                }
                return false;
            }

            function checkDraw() {
                return state.board[0].every(cell => cell !== 0);
            }

            function highlightWinningCells(coords) {
                const cells = document.querySelectorAll('.cell');
                coords.forEach(([r, c]) => {
                    const idx = r * COLS + c;
                    cells[idx].classList.add('win-highlight');
                });
            }

            // --- 5. AI LOGIC ---
            function aiTurn() {
                if (!state.gameActive) return;

                // 1. Try to Win
                let col = findBestMove(2); 
                
                // 2. Block Player Win
                if (col === -1) col = findBestMove(1);

                // 3. Smart Random (Prefer center)
                if (col === -1) {
                    const centerOrder = [3, 2, 4, 1, 5, 0, 6]; // Priority list
                    const validCols = centerOrder.filter(c => state.board[0][c] === 0);
                    if (validCols.length > 0) {
                        // Pick from top 3 valid options randomly to vary play
                        const pick = validCols.slice(0, Math.min(validCols.length, 3));
                        col = pick[Math.floor(Math.random() * pick.length)];
                    }
                }

                if (col !== -1) attemptDrop(col);
            }

            // Helper to check if a move leads to 4 in a row
            function findBestMove(player) {
                for (let c = 0; c < COLS; c++) {
                    // Find where disc would land
                    let r = -1;
                    for (let row = ROWS - 1; row >= 0; row--) {
                        if (state.board[row][c] === 0) {
                            r = row;
                            break;
                        }
                    }
                    
                    if (r !== -1) {
                        // Simulate Move
                        state.board[r][c] = player;
                        const win = checkWinSimulated(r, c, player);
                        state.board[r][c] = 0; // Undo
                        if (win) return c;
                    }
                }
                return -1;
            }

            // Simplified win check without UI effects for AI simulation
            function checkWinSimulated(r, c, player) {
                const directions = [[0,1], [1,0], [1,1], [1,-1]];
                for (let [dr, dc] of directions) {
                    let count = 1;
                    for (let i = 1; i < 4; i++) {
                        const nr = r + dr * i, nc = c + dc * i;
                        if (nr>=0 && nr<ROWS && nc>=0 && nc<COLS && state.board[nr][nc] === player) count++; else break;
                    }
                    for (let i = 1; i < 4; i++) {
                        const nr = r - dr * i, nc = c - dc * i;
                        if (nr>=0 && nr<ROWS && nc>=0 && nc<COLS && state.board[nr][nc] === player) count++; else break;
                    }
                    if (count >= 4) return true;
                }
                return false;
            }

            // --- 6. END GAME & UI ---
            function endGame(winner) {
                state.gameActive = false;
                state.isDropping = false;

                let title = "";
                let msg = "";

                if (winner === 'draw') {
                    state.scores.draws++;
                    title = "DRAW";
                    msg = "Board Full. No Winner.";
                    els.resultTitle.style.color = "#fff";
                } else {
                    if (winner === 1) {
                        state.scores.p1++;
                        title = `${state.names.p1} WINS!`;
                        els.resultTitle.style.color = "var(--neon-cyan)";
                    } else {
                        state.scores.p2++;
                        title = `${state.names.p2} WINS!`;
                        els.resultTitle.style.color = "var(--neon-magenta)";
                    }
                }

                saveData();
                updateScoreboardUI();

                els.resultTitle.textContent = title;
                els.resultMsg.textContent = msg;
                
                setTimeout(() => {
                    els.gameOverScreen.classList.add('active');
                }, 1000); // Delay to see winning line
            }

            function highlightTurn() {
                if (state.currentPlayer === 1) {
                    els.boxP1.classList.add('active');
                    els.boxP2.classList.remove('active');
                } else {
                    els.boxP1.classList.remove('active');
                    els.boxP2.classList.add('active');
                }
            }

            function updateScoreboardUI() {
                els.scoreP1.textContent = state.scores.p1;
                els.scoreP2.textContent = state.scores.p2;
                els.scoreDraw.textContent = state.scores.draws;
                els.nameP1.textContent = state.names.p1;
                els.nameP2.textContent = state.names.p2;
            }

            // --- 7. UTILS ---
            function saveData() {
                const data = { scores: state.scores, names: state.names };
                localStorage.setItem('neonConnect4', JSON.stringify(data));
            }

            function loadData() {
                const data = JSON.parse(localStorage.getItem('neonConnect4'));
                if (data) {
                    state.scores = data.scores || { p1: 0, p2: 0, draws: 0 };
                    // Only restore player name, not AI name if switching modes
                    if (data.names) state.names.p1 = data.names.p1;
                }
                updateScoreboardUI();
            }

            function resetData() {
                if (confirm("Reset all scores and names?")) {
                    localStorage.removeItem('neonConnect4');
                    state.scores = { p1: 0, p2: 0, draws: 0 };
                    state.names.p1 = "Player";
                    location.reload();
                }
            }

            function setupNetwork() {
                function update() {
                    if (navigator.onLine) {
                        els.netStatus.textContent = "🟢 ONLINE";
                        els.netStatus.className = "status-badge online";
                    } else {
                        els.netStatus.textContent = "🔴 OFFLINE";
                        els.netStatus.className = "status-badge offline";
                    }
                }
                window.addEventListener('online', update);
                window.addEventListener('offline', update);
                update();
            }

            return { init, startGame, restartRound, showMenu, resetData };
        })();

        document.addEventListener('DOMContentLoaded', Game.init);

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => console.log("SW Registered"));
        }
    </script>
</body>
</html>
