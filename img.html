<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট ইমেজ লিঙ্ক এক্সট্র্যাক্টর</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="url"], button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        textarea { width: 100%; height: 300px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 10px; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ওয়েবসাইট ইমেজ লিঙ্ক এক্সট্র্যাক্টর</h1>
        <p>যে কোনো ওয়েবসাইটের লিঙ্ক দিন (ইমেজ লিঙ্ক বের করার জন্য):</p>

        <input type="url" id="websiteUrl" placeholder="যেমন: https://example.com" required>
        <button id="extractButton">লিঙ্ক বের করুন</button>

        <p id="status"></p>

        <h2>প্রাপ্ত ইমেজ লিঙ্কসমূহ:</h2>
        <textarea id="outputText" readonly placeholder="ইমেজ লিঙ্কগুলো এখানে দেখা যাবে, প্রতিটি নতুন লাইনে।"></textarea>
    </div>

    <script>
        // ⭐ আপনার Cloudflare Worker-এর URL এখানে যোগ করা হয়েছে
        const WORKER_URL = "https://img.csmmohasinalam.workers.dev/"; 

        document.getElementById('extractButton').addEventListener('click', async () => {
            const urlInput = document.getElementById('websiteUrl').value;
            const outputTextarea = document.getElementById('outputText');
            const statusMessage = document.getElementById('status');
            
            if (!urlInput) {
                statusMessage.textContent = "দয়া করে একটি বৈধ URL দিন।";
                return;
            }

            statusMessage.textContent = "প্রক্রিয়া চলছে... অপেক্ষা করুন।";
            outputTextarea.value = ""; 

            try {
                // Worker-কে POST রিকোয়েস্ট পাঠানো
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ targetUrl: urlInput }),
                });

                if (!response.ok) {
                    // Worker থেকে আসা সুনির্দিষ্ট এরর মেসেজ ধরার চেষ্টা
                    const errorDetails = await response.text();
                    // Worker কোড থেকে আসা এরর মেসেজটি থ্রো করা হলো
                    throw new Error(errorDetails); 
                }

                // সফল হলে ইমেজ লিঙ্কগুলি নতুন লাইনে পাওয়া যাবে
                const resultText = await response.text(); 
                
                outputTextarea.value = resultText;
                
                // লিঙ্ক সংখ্যা গণনা করে স্ট্যাটাস মেসেজ তৈরি
                const linkCount = resultText.split('\n').filter(link => link.trim() !== '').length;
                
                if (linkCount > 0) {
                    statusMessage.style.color = '#28a745'; 
                    statusMessage.textContent = `✅ সফলভাবে ${linkCount}টি ইমেজ লিঙ্ক বের করা হয়েছে!`;
                } else {
                    statusMessage.style.color = '#ffc107'; // সতর্কতা রঙ
                    statusMessage.textContent = `⚠️ কোনো ইমেজ লিঙ্ক পাওয়া যায়নি।`;
                }


            } catch (error) {
                console.error("Fetch Error:", error);
                statusMessage.style.color = '#d9534f'; // এররের জন্য লাল রঙ
                // Worker থেকে আসা এরর মেসেজটি সরাসরি দেখানো
                statusMessage.textContent = `🚫 ত্রুটি: ${error.message}`;
                outputTextarea.value = "ইমেজ লিঙ্ক বের করা যায়নি। ত্রুটির জন্য উপরে দেখুন।";
            }
        });
    </script>

</body>
</html>
