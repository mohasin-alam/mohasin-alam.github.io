<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট ইমেজ এক্সট্র্যাক্টর - টার্মিনাল স্টাইল</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        /* গ্লোবাল স্টাইলস */
        body {
            font-family: 'Roboto Mono', 'Cascadia Code', monospace; /* টার্মিনাল ফন্ট */
            margin: 0;
            background-color: #0d1117; /* GitHub Dark Mode Background */
            color: #00ff00; /* টার্মিনাল সবুজ টেক্সট */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* কন্টেন্ট উপরে শুরু হবে */
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* কন্টেন্ট বেশি হলে স্ক্রলবার */
        }

        /* টার্মিনাল কন্টেইনার */
        .terminal-container {
            max-width: 900px;
            width: 100%;
            background-color: #1a1a1a; /* টার্মিনাল উইন্ডোর ব্যাকগ্রাউন্ড */
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); /* সবুজ গ্লো */
            padding: 20px;
            box-sizing: border-box;
            animation: fadeIn 0.8s ease-out;
        }

        /* অ্যানিমেশন */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blinkCursor {
            50% { border-color: transparent; }
        }

        /* শিরোনাম */
        h1, h2 {
            color: #00ffff; /* সায়ান রঙ */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
        }
        h2 {
            margin-top: 30px;
            font-size: 1.3em;
        }

        /* প্যারাগ্রাফ */
        p {
            color: #eee;
            margin-bottom: 15px;
        }

        /* ইনপুট ফিল্ড */
        input[type="url"] {
            background-color: #222;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Roboto Mono', 'Cascadia Code', monospace;
            font-size: 1em;
            box-sizing: border-box;
            width: calc(100% - 20px); /* বামে একটু ফাঁকা রাখার জন্য */
            margin-bottom: 15px;
            transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            outline: none;
        }
        input[type="url"]:focus {
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        /* বাটন */
        button {
            background-color: #008000; /* সবুজ বাটন */
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Roboto Mono', 'Cascadia Code', monospace;
            font-size: 1em;
            width: 100%;
            margin-bottom: 20px;
            transition: background-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        button:hover {
            background-color: #00b300;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }
        button:active {
            background-color: #006600;
        }

        /* স্ট্যাটাস মেসেজ */
        #status {
            margin-top: 10px;
            padding: 8px;
            border-left: 3px solid;
            margin-bottom: 20px;
            color: #eee; /* ডিফল্ট কালার */
        }
        #status.success { border-color: #00ff00; color: #00ff00; }
        #status.warning { border-color: #ffcc00; color: #ffcc00; }
        #status.error { border-color: #ff0000; color: #ff0000; }
        #status.info { border-color: #00ffff; color: #00ffff; }

        /* ইমেজ গ্যালারি */
        #imageGallery { 
            max-height: 450px; /* উচ্চতা বাড়ানো হয়েছে */
            overflow-y: auto; 
            padding: 10px; 
            border: 1px solid #00ff00; /* সবুজ বর্ডার */
            border-radius: 4px; 
            background-color: #0a0a0a; /* ডার্ক গ্যালারি ব্যাকগ্রাউন্ড */
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            margin-top: 10px;
            box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.2); /* ইনসেট শ্যাডো */
            min-height: 100px; /* খালি গ্যালারির জন্য ন্যূনতম উচ্চতা */
        }
        #imageGallery p {
            color: #777;
            width: 100%;
            text-align: center;
            margin: auto;
        }
        .image-container {
            border: 1px solid #333;
            padding: 5px;
            background-color: #222;
            flex-basis: 160px; /* প্রতিটি ইমেজ কনটেইনারের সাইজ বাড়ানো হয়েছে */
            max-width: 100%;
            height: 160px;
            overflow: hidden;
            text-align: center;
            display: flex; /* ইমেজ সেন্টারে আনার জন্য */
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
            transition: transform 0.2s ease-in-out;
        }
        .image-container:hover {
            transform: scale(1.05); /* হোভারে একটু বড় হবে */
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .image-container .error-message {
            color: #ff0000;
            font-size: 0.8em;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1>[ Image-Extractor@Terminal ]</h1>
        <p>Type a URL and press ENTER to extract images.</p>

        <input type="url" id="websiteUrl" placeholder=">> Enter website URL (e.g., https://example.com)" required>
        <button id="extractButton">>>> EXTRACT IMAGES</button>

        <div id="status" class="info">Status: Ready.</div>

        <h2>[ Image-Output ]</h2>
        <div id="imageGallery">
            <p>Awaiting URL input. Images will appear here.</p>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://fi.csmmohasinalam.workers.dev/"; 

        document.getElementById('extractButton').addEventListener('click', async () => {
            const urlInput = document.getElementById('websiteUrl').value;
            const statusMessage = document.getElementById('status');
            const imageGallery = document.getElementById('imageGallery');
            
            // স্ট্যাটাস রিসেট
            statusMessage.className = 'info';
            statusMessage.textContent = "Status: Initializing extraction...";
            imageGallery.innerHTML = ''; 

            if (!urlInput) {
                statusMessage.className = 'error';
                statusMessage.textContent = "Error: Please enter a valid URL.";
                return;
            }

            statusMessage.className = 'info';
            statusMessage.textContent = "Status: Processing URL... Standby.";
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ targetUrl: urlInput }),
                });

                if (!response.ok) {
                    const errorDetails = await response.text();
                    throw new Error(errorDetails); 
                }

                const resultText = await response.text(); 
                
                const linksArray = resultText.split('\n').filter(link => link.trim() !== '');
                const linkCount = linksArray.length;
                
                if (linkCount > 0) {
                    linksArray.forEach(link => {
                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'image-container';
                        
                        const img = document.createElement('img');
                        img.src = link;
                        img.alt = 'Scraped Image';
                        
                        img.onerror = function() {
                            imgContainer.innerHTML = `<p class="error-message">🚫 Failed to load</p>`;
                        };
                        
                        imgContainer.appendChild(img);
                        imageGallery.appendChild(imgContainer);
                    });
                    
                    statusMessage.className = 'success'; 
                    statusMessage.textContent = `Success: ${linkCount} images loaded.`;
                } else {
                    statusMessage.className = 'warning'; 
                    statusMessage.textContent = `Warning: No image links found.`;
                    imageGallery.innerHTML = '<p>No image links found for this URL.</p>';
                }


            } catch (error) {
                console.error("Fetch Error:", error);
                statusMessage.className = 'error'; 
                statusMessage.textContent = `Error: ${error.message}`;
                imageGallery.innerHTML = `<p class="error-message">Image loading failed. Check the error message above.</p>`;
            }
        });
    </script>

</body>
</html>
