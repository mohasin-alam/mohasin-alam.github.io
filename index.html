<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট সোর্স কোড ভিউয়ার</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="container">
        <h1 class="glitch-text">Website Source Code Hacker by Csm Mohasin Alam</h1>
        
        <input type="url" id="websiteUrl" placeholder="এখানে ওয়েবসাইটের URL দিন (যেমন: https://google.com)" required>
        <button id="viewSourceBtn">সোর্স কোড দেখুন</button>
        
        <p id="statusMessage" class="hidden"></p>
        
        <pre class="code-area"><code id="sourceCodeOutput" class="language-html">এখানে আউটপুট দেখা যাবে...</code></pre>
        
        <div class="action-buttons hidden" id="actionButtons">
            <button id="copyCodeBtn">কোড কপি করুন</button>
            <button id="downloadCodeBtn">HTML ডাউনলোড করুন</button>
        </div>
        
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
