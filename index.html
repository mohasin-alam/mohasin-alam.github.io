/* ==================================================

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&family=VT323&display=swap');

:root {
  --bg: #020508;
  --panel: #060e0b;
  --text: #39ff14;
  --accent: #00ff41;
  --accent2: #00ffe5;
  --magenta: #ff00c8;

  --border: rgba(0,255,65,.45);

}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; position: relative;
  font-family: 'Share Tech Mono', monospace;
  background: var(--bg);
  color: var(--text);
}

/* matrix & scanline overlays */
#matrixCanvas { position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(to bottom, rgba(0,255,65,.04), rgba(0,255,65,.04) 1px, transparent 2px, transparent 4px);
  mix-blend-mode: screen; animation: scan 8s linear infinite;
}
@keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(30px); } }
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
}

@keyframes flicker {
  0%, 100% { filter: brightness(1); } 
  92% { filter: brightness(1); } 93% { filter: brightness(1.2); } 
  94% { filter: brightness(0.9); } 95% { filter: brightness(1.1); }
}
@keyframes borderPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(0,255,65,.2), inset 0 0 30px rgba(0,255,65,.05); }
  50% { box-shadow: 0 0 40px rgba(0,255,65,.4), inset 0 0 50px rgba(0,255,65,.1); }
}
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.wrap { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 15px; }

.container {
  background: rgba(2, 6, 4, 0.92);
  border: 1px solid var(--border);
  padding: 18px;
  animation: flicker 8s infinite, borderPulse 3s ease-in-out infinite, fadeSlideIn 0.5s ease both;
  backdrop-filter: blur(5px);
}

/* boot overlay */
#bootOverlay {
  position: fixed; inset: 0; z-index: 50; background: #000; color: var(--accent);
  font-size: 14px; padding: 20px; white-space: pre-wrap; overflow: hidden; transition: opacity 0.5s;
}
#bootOverlay.hide { opacity: 0; pointer-events: none; }

/* top bar */
.terminal-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 15px;
  border: 1px solid var(--border); background: rgba(0,30,15,.5);
  box-shadow: inset 0 0 15px rgba(0,255,65,.15); margin-bottom: 12px; flex-wrap: wrap;
}
.terminal-dots { display: flex; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.red { background: #ff3b3b; box-shadow: 0 0 10px #ff3b3b; }
.dot.yellow { background: #ffb000; box-shadow: 0 0 10px #ffb000; }
.dot.green { background: #39ff14; box-shadow: 0 0 10px #39ff14; }
.terminal-title { 
  flex: 1; color: var(--accent); text-shadow: var(--glow); 
  letter-spacing: 2px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
}
.terminal-signal { 
  font-size: 12px; color: var(--accent2); text-shadow: 0 0 8px var(--accent2);
  border: 1px solid var(--accent2); padding: 3px 10px; 
}
.terminal-signal.live { color: var(--red); border-color: var(--red); animation: blinkSig 1s step-end infinite; }
@keyframes blinkSig { 50% { opacity: 0.2; } }

/* symbol bar added per instruction */
.symbol-bar {

}
.symbol-bar span { animation: glitch 5s infinite alternate; opacity: 0.8; }

.stats-strip {

h1 {

@keyframes glitch {

@keyframes scanMove { 0% { left: -50%; } 100% { left: 100%; } }

.code-area {

@keyframes beamSweep { 0% { top: 0; } 100% { top: 100%; } }

.code-area code { display: block; color: var(--text); white-space: pre-wrap; word-wrap: break-word; }

/* Mobile Responsive Syntax Highlighting Colors */

<script>
// Boot Sequence
setTimeout(() => {
  const overlay = document.getElementById('bootOverlay');
  if(overlay) { overlay.classList.add('hide'); setTimeout(()=>overlay.remove(), 500); }
}, 1500);

// Matrix Background
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let cols, drops;
function initMatrix() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / 15);
  drops = Array(cols).fill(0);
}
initMatrix();
window.addEventListener('resize', initMatrix);
setInterval(() => {
  ctx.fillStyle = 'rgba(2, 5, 8, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff41'; ctx.font = '15px monospace';
  drops.forEach((y, i) => {
    const text = String.fromCharCode(Math.random() * 128);
    ctx.fillText(text, i * 15, y * 15);
    if (y * 15 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  });
}, 50);

// Fake Stats
setInterval(() => {
  document.getElementById('statCpu').textContent = Math.floor(Math.random() * 40 + 20) + '%';
  document.getElementById('statMem').textContent = Math.floor(Math.random() * 50 + 30) + '%';
  document.getElementById('statPing').textContent = Math.floor(Math.random() * 60 + 10) + 'ms';
}, 1000);
</script>

<script>
(function () {
  const output = document.getElementById('sourceCodeOutput');
  const codeArea = document.querySelector('.code-area');
  const loader = document.getElementById('terminalLoader');
  const scanBar = document.getElementById('scanBar');
  const signal = document.getElementById('terminalSignal');
  
  let typingInterval = null;
  let loadingInterval = null;

  // Toggle mode logic
  document.getElementById('modeInstant').addEventListener('change', function() {
    if(this.checked) document.getElementById('modeType').checked = false;
  });
  document.getElementById('modeType').addEventListener('change', function() {
    if(this.checked) document.getElementById('modeInstant').checked = false;
  });

  // Loader Observer
  new MutationObserver(() => {
    if (codeArea.classList.contains('loading')) {
      loader.classList.remove('hidden'); scanBar.classList.remove('hidden');
      signal.textContent = "[HACKING]"; signal.classList.add('live');
      let dots = '';
      loadingInterval = setInterval(() => {
        dots = dots.length > 3 ? '' : dots + '.';
        loader.textContent = `[CONNECTING TO TARGET HOST]${dots}\nExtracting nodes...\nBypassing firewall...`;
      }, 300);
    } else {
      clearInterval(loadingInterval);
      loader.classList.add('hidden'); scanBar.classList.add('hidden');
      signal.textContent = "[SYSTEM IDLE]"; signal.classList.remove('live');
    }
  }).observe(codeArea, { attributes: true, attributeFilter: ['class'] });

  // Mobile Safe Regex Highlighting
  function applySyntaxHighlighting(text) {
    if (text.length > 100000) return escapeHTML(text); // Prevent hang on huge files
    let safeText = escapeHTML(text);
    return safeText
      .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="hl-cmt">$1</span>') // Comments
      .replace(/(&lt;\/?[\w\d:-]+)/g, '<span class="hl-tag">$1</span>') // Tags
      .replace(/(\/?&gt;)/g, '<span class="hl-tag">$1</span>') // Tag close
      .replace(/([a-zA-Z\-]+)=/g, '<span class="hl-attr">$1</span>=') // Attributes
      .replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class="hl-str">$1</span>'); // Strings
  }

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // BUG-FREE TYPING ENGINE (No Over-Loop)
  window.__renderSource = function(rawText) {
    window.__cancelRender(); // Kill any running instance

    const isTypeMode = document.getElementById('modeType').checked;
    
    if (!isTypeMode) {
      output.innerHTML = applySyntaxHighlighting(rawText);
      return;
    }

    output.classList.add('is-typing');
    codeArea.classList.add('writing');
    output.textContent = "";

    const len = rawText.length;
    let index = 0;
    const duration = 4000; // Complete typing in 4 seconds regardless of size
    const tickRate = 30;
    const chunkSize = Math.max(1, Math.ceil(len / (duration / tickRate)));

    typingInterval = setInterval(() => {
      if (index >= len) {
        window.__cancelRender(); // Clear styling and intervals properly
        output.innerHTML = applySyntaxHighlighting(rawText); // Apply color at the end
        return;
      }
      output.textContent += rawText.substring(index, index + chunkSize);
      index += chunkSize;
      codeArea.scrollTop = codeArea.scrollHeight;
    }, tickRate);
  };

  window.__cancelRender = function() {
    clearInterval(typingInterval);
    output.classList.remove('is-typing');
    codeArea.classList.remove('writing');
  };
})();
</script>
