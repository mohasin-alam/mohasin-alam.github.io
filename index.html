<script>
fetch("https://ipapi.co/json/")
.then(res => res.json())
.then(data => {
  if (data.country === "IN") {
    document.body.innerHTML =
      "<h2 style='text-align:center;margin-top:50px;'>Access not allowed from India</h2>";
  }
});
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট সোর্স কোড ভিউয়ার</title>
    
<style>
/* --- Embedded CSS from https://mohasin-alam.github.io/style.css --- */
/* -------------------------------------- */
/* ১. ফন্ট ইমপোর্ট এবং বেস স্টাইল (টার্মিনাল লুক) */
/* -------------------------------------- */

@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&display=swap');

:root {
    --color-dark-bg: #0d121c;         /* প্রধান ব্যাকগ্রাউন্ড */
    --color-text: #39ff14;            /* নিয়ন গ্রিন টেক্সট */
    --color-accent: #00ff00;          /* উজ্জ্বল অ্যাকসেন্ট (নিয়ন গ্রিন) */
    --color-border: #008000;          /* গাঢ় সবুজ বর্ডার */
    --color-error: #ff5757;           /* ত্রুটি রং */
    --shadow-glow: 0 0 5px var(--color-accent), 0 0 10px var(--color-accent);
}

body {
    font-family: 'Share Tech Mono', monospace;
    background-color: var(--color-dark-bg);
    color: var(--color-text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    background: #060b14; 
    padding: 30px 40px;
    border-radius: 0; 
    box-shadow: 0 0 15px var(--color-border); 
    border: 1px solid var(--color-border);
    width: 100%;
    max-width: 900px;
    animation: neon-pulse 4s infinite ease-in-out; /* স্লো পালস অ্যানিমেশন */
}

h1 {
    color: var(--color-accent);
    text-align: center;
    margin-bottom: 30px;
    text-shadow: var(--shadow-glow);
    letter-spacing: 3px;
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 10px;
}

/* ইনপুট এবং বাটন স্টাইল */
input[type="url"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid var(--color-border);
    border-radius: 0;
    box-sizing: border-box;
    font-size: 16px;
    background-color: #030508;
    color: var(--color-text);
    box-shadow: inset 0 0 5px rgba(0, 128, 0, 0.5);
    font-family: 'Share Tech Mono', monospace;
}

input[type="url"]:focus {
    border-color: var(--color-accent);
    box-shadow: var(--shadow-glow);
    outline: none;
}

#viewSourceBtn {
    background-color: transparent;
    color: var(--color-accent);
    padding: 12px 20px;
    border: 2px solid var(--color-accent);
    border-radius: 0;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s, box-shadow 0.3s;
    width: 100%;
    margin-bottom: 30px;
    text-transform: uppercase;
    box-shadow: var(--shadow-glow);
}

#viewSourceBtn:hover:not(:disabled) {
    background-color: rgba(0, 255, 0, 0.1);
    box-shadow: 0 0 20px var(--color-accent);
}
#viewSourceBtn:disabled { 
    cursor: not-allowed;
    opacity: 0.7;
}

/* -------------------------------------- */
/* ২. কোড এরিয়া (টার্মিনাল লুক) */
/* -------------------------------------- */

.code-area {
    margin-top: 20px;
    background: #000000; /* খাঁটি কালো ব্যাকগ্রাউন্ড */
    border: 1px dashed var(--color-border); 
    border-radius: 0;
    padding: 15px;
    max-height: 500px;
    overflow: auto;
    font-size: 14px;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    line-height: 1.4;
    position: relative;
}

/* স্ট্যাটাস মেসেজ - টার্মিনাল প্রম্পট */
#statusMessage {
    text-align: left;
    color: var(--color-text);
    font-weight: bold;
    display: none;
    margin-bottom: 15px;
    padding-left: 10px;
    font-family: 'Share Tech Mono', monospace;
}
#statusMessage:before {
    content: "[ATTEMPTING ACCESS]>"; /* টার্মিনাল প্রম্পট */
    color: var(--color-error);
    margin-right: 5px;
}

.hidden {
    display: none !important;
}
.code-area code {
    display: block; 
}

/* -------------------------------------- */
/* ৩. সিনট্যাক্স হাইলাইটিং ফিক্স (Prism.js Override) */
/* -------------------------------------- */

.code-area code {
    color: var(--color-text) !important; 
}

.token.tag, .token.attr-name, .token.selector {
    color: #00ffff !important; /* সায়ান ট্যাগ/অ্যাট্রিবিউট */
    text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
}
.token.punctuation, .token.operator {
    color: #ff00ff !important; /* ম্যাজেন্টা চিহ্ণ */
}
.token.attr-value, .token.string {
    color: #39ff14 !important; /* উজ্জ্বল সবুজ স্ট্রিং */
}
.token.comment {
    color: #008000 !important; /* গাঢ় সবুজ কমেন্ট */
}
.token.doctype, .token.prolog {
    color: #ffa500 !important; /* কমলা ডকটাইপ */
}

/* -------------------------------------- */
/* ৪. বাটন এরিয়া স্টাইল (FINAL) */
/* -------------------------------------- */
.action-buttons {
    display: flex;
    justify-content: flex-end; /* বাটনগুলি ডানদিকে থাকবে */
    gap: 15px; 
    margin-top: 20px;
    margin-bottom: 10px;
}

.action-buttons button {
    background-color: transparent;
    color: var(--color-accent);
    padding: 10px 15px;
    border: 1px solid var(--color-accent);
    border-radius: 0;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s, box-shadow 0.3s;
    text-transform: uppercase;
    box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
    font-family: 'Share Tech Mono', monospace;
}

.action-buttons button:hover {
    background-color: rgba(0, 255, 0, 0.15);
    box-shadow: 0 0 10px var(--color-accent);
}

.action-buttons button:active {
    background-color: rgba(0, 255, 0, 0.3);
}


/* -------------------------------------- */
/* ৫. অ্যানিমেশন এবং ইফেক্ট */
/* -------------------------------------- */

/* A. ধীর গতির গ্লিচ ইফেক্ট (কম দৃশ্যমান) */
@keyframes glitch {
    0%, 100% { text-shadow: 1px 0 0 var(--color-accent), -1px 0 0 #ff00ff; }
    10% { text-shadow: -1px 0 0 #ff00ff, 1px 0 0 var(--color-accent); }
    12% { text-shadow: 2px 0 0 var(--color-accent), -2px 0 0 #ff00ff; }
    20% { text-shadow: -2px 0 0 #ff00ff, 2px 0 0 var(--color-accent); }
}

.glitch-text {
    animation: glitch 4s infinite alternate step-end; 
}

/* B. কীবোর্ড কার্সার অ্যানিমেশন (লোডিং এর জন্য) */
@keyframes blink-caret {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
}

/* কীবোর্ড কার্সার স্টাইল - লোডিং এর সময় দেখাবে */
.code-area.loading code:after {
    content: '_'; 
    display: inline;
    animation: blink-caret .75s step-end infinite;
}

/* C. কন্টেইনার পালস */
@keyframes neon-pulse {
    0% { box-shadow: 0 0 5px var(--color-border); }
    50% { box-shadow: 0 0 15px var(--color-accent), 0 0 30px var(--color-accent); }
    100% { box-shadow: 0 0 5px var(--color-border); }
}

/* ------------------------------------- */
</style>
    </head>
<body>
    <div class="container">
        <h1 class="glitch-text">Website Source Code Hacker by Csm Mohasin Alam</h1>
        
        <input type="url" id="websiteUrl" placeholder="এখানে ওয়েবসাইটের URL দিন (যেমন: https://google.com)" required>
        <button id="viewSourceBtn">সোর্স কোড দেখুন</button>
        
        <p id="statusMessage" class="hidden"></p>
        
        <pre class="code-area"><code id="sourceCodeOutput" class="language-html">এখানে আউটপুট দেখা যাবে...</code></pre>
        
        <div class="action-buttons hidden" id="actionButtons">
            <button id="copyCodeBtn">কোড কপি করুন</button>
            <button id="downloadCodeBtn">HTML ডাউনলোড করুন</button>
        </div>
        
    </div>

<script>
// --- Embedded JS from https://mohasin-alam.github.io/script.js (FINAL VERSION) ---
document.getElementById('viewSourceBtn').addEventListener('click', fetchSourceCode);
document.getElementById('copyCodeBtn').addEventListener('click', copyCode);
document.getElementById('downloadCodeBtn').addEventListener('click', downloadCode);

// *** আপনার Cloudflare Worker URL (সংশোধিত) এখানে যুক্ত করা হলো ***
const workerUrl = "https://delicate-tree-21a6.csmmohasinalam.workers.dev/"; 

function fetchSourceCode() {
    const websiteInput = document.getElementById('websiteUrl').value;
    const outputElement = document.getElementById('sourceCodeOutput');
    const outputArea = document.querySelector('.code-area');
    const statusMessage = document.getElementById('statusMessage');
    const viewButton = document.getElementById('viewSourceBtn');
    const actionButtons = document.getElementById('actionButtons'); 

    // ** ব্লক করা ডোমেনগুলির তালিকা এবং চেকিং লজিক **
    
    const myBlockedDomains = [
        'mohasin.github.io', 
        'husneurb.vom', 
        'mohasin-alam.github.io', 
        'PLACEHOLDER_4_YOUR_DOMAIN.com', // <-- এখানে আপনার ৪ নম্বর ডোমেনটি বসান
        'PLACEHOLDER_5_YOUR_DOMAIN.net'  // <-- এখানে আপনার ৫ নম্বর ডোমেনটি বসান
        // আপনি চাইলে আরও ডোমেন এই তালিকার শেষে যোগ করতে পারেন
    ];

    try {
        // ইনপুট URL-কে সঠিকভাবে পার্স করার চেষ্টা
        const inputUrl = new URL(websiteInput.startsWith('http') ? websiteInput : `https://${websiteInput}`);
        const inputHostname = inputUrl.hostname;
        
        // চেক করুন ইনপুট ডোমেনটি ব্লক করা ডোমেনগুলির কোনোটির সাথে মেলে কিনা
        const isBlocked = myBlockedDomains.some(domain => {
            // খালি বা PLACEHOLDER ডোমেনগুলি পরীক্ষা করা থেকে বাদ দেওয়া হচ্ছে
            if (domain.includes('PLACEHOLDER') || domain.length === 0) return false;
            
            // ডোমেন চেক: ইনপুট হোস্টনেম-এ ব্লক করা ডোমেন স্ট্রিংটি আছে কিনা
            return inputHostname.includes(domain);
        });

        if (isBlocked) {
            // যদি ব্লক করা হয়, তবে কাস্টম মেসেজ দেখান
            viewButton.disabled = false;
            actionButtons.classList.add('hidden'); 
            statusMessage.classList.add('hidden');
            outputArea.classList.remove('loading');
            
            // কাস্টম বার্তা প্রদর্শন
            outputElement.textContent = "শালা আমাকে দিয়ে আমারই কাপড় খোলাতে চাইছির! পারবি না 😡";
            outputElement.classList.remove('language-html'); 
            
            return; 
        }
    } catch (e) {
        // যদি URL পার্স করা না যায়, তবে সাধারণ প্রসেস চালিয়ে যান
    }

    if (!websiteInput) {
        alert("অনুগ্রহ করে একটি URL দিন।");
        return;
    }

    // লোডিং শুরু
    viewButton.disabled = true;
    actionButtons.classList.add('hidden'); 
    outputElement.textContent = '';
    outputArea.classList.add('loading'); 
    statusMessage.textContent = 'ওয়েবসাইটের সোর্স কোড আনা হচ্ছে... এনক্রিপশন প্রসেস শুরু হচ্ছে...';
    statusMessage.classList.remove('hidden');
    
    // Worker-কে URL প্যারামিটার সহ কল করার জন্য URL তৈরি
    const fetchWorkerUrl = `${workerUrl}?url=${encodeURIComponent(websiteInput)}`;
    
    fetch(fetchWorkerUrl)
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => {
                    try {
                        const data = JSON.parse(text);
                        throw new Error(data.error || `Worker ত্রুটি: HTTP ${response.status}`);
                    } catch (e) {
                        throw new Error(`নেটওয়ার্ক ত্রুটি: HTTP ${response.status}.`);
                    }
                });
            }
            return response.text();
        })
        .then(htmlCode => {
            // লোডিং শেষ
            statusMessage.classList.add('hidden');
            outputArea.classList.remove('loading');
            viewButton.disabled = false;
            actionButtons.classList.remove('hidden'); 

            // কোড দেখানো এবং হাইলাইটিং
            outputElement.textContent = htmlCode;
            outputElement.classList.add('language-html');
            // এই লাইনের কারণেই 'Prism is not defined' আসছিল, তাই নিশ্চিত করা হলো যেন Prism লোড হওয়ার পরই এটি কল হয়।
            Prism.highlightElement(outputElement); 
        })
        .catch(error => {
            // ত্রুটি হলে
            statusMessage.classList.add('hidden');
            outputArea.classList.remove('loading');
            viewButton.disabled = false;
            actionButtons.classList.add('hidden'); 
            outputElement.textContent = `[ACCESS DENIED]>> কোড লোড করা যায়নি। ত্রুটি: ${error.message}`;
            console.error('Fetching error:', error);
        });
}

function copyCode() {
    const code = document.getElementById('sourceCodeOutput').textContent;
    navigator.clipboard.writeText(code).then(() => {
        alert('কোড সফলভাবে কপি করা হয়েছে!');
    }).catch(err => {
        alert('কপি করতে ব্যর্থ হয়েছে। অনুগ্রহ করে ম্যানুয়ালি কপি করুন।');
        console.error('Copy failed:', err);
    });
}

function downloadCode() {
    const code = document.getElementById('sourceCodeOutput').textContent;
    const urlInput = document.getElementById('websiteUrl').value || 'untitled';
    
    // URL থেকে ডোমেইন নাম বের করার চেষ্টা
    let filename;
    try {
        const urlObj = new URL(urlInput.startsWith('http') ? urlInput : `https://${urlInput}`);
        filename = urlObj.hostname.replace('www.', '').replace(/\./g, '_');
    } catch (e) {
        filename = 'source_code';
    }

    const blob = new Blob([code], { type: 'text/html' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${filename}.html`;
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    alert(`'${filename}.html' ডাউনলোড করা হচ্ছে...`);
}
</script>
</body>
</html>
