<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker VR Tunnel</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        :root {
            --hacker-green: #00ff41;
            --dark-bg: #0a0a0a;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Hacker Frame/Tunnel UI */
        .viewer-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            border: 5px solid #111;
            box-sizing: border-box;
            box-shadow: inset 0 0 100px rgba(0, 255, 65, 0.2);
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        /* Overlay Elements */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* যাতে মাউস ক্লিক কাজ করে */
            z-index: 10;
            border: 20px solid transparent;
            border-image: linear-gradient(to bottom right, var(--hacker-green), transparent) 1;
            opacity: 0.3;
        }

        .hud-text {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--hacker-green);
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--hacker-green);
            z-index: 100;
        }

        .scanning-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            top: 0;
            z-index: 100;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Pannellum Control Styling */
        .pnlm-control { background: rgba(0, 40, 0, 0.7) !important; border-color: var(--hacker-green) !important; }
        .pnlm-render-container { filter: sepia(20%) hue-rotate(80deg) brightness(90%); }
    </style>
</head>
<body>

<div class="viewer-container">
    <div class="hud-text">
        [ SYSTEM: ONLINE ]<br>
        [ SCANNING SECTOR 360... ]<br>
        <span id="coords">COORDS: 0.00, 0.00</span>
    </div>
    <div class="scanning-line"></div>
    <div class="overlay"></div>
    
    <div id="panorama"></div>
</div>

<script>
    const viewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "picture.jpg", // এখানে আপনার ছবির ফাইল নাম দিন
        "autoLoad": true,
        "autoRotate": -1.5,
        "compass": true,
        "hfov": 110
    });

    // মাউস মুভমেন্টের সাথে কোঅর্ডিনেট আপডেট (Hacker Feel)
    viewer.on('mouseup', function(event) {
        let pitch = viewer.getPitch().toFixed(2);
        let yaw = viewer.getYaw().toFixed(2);
        document.getElementById('coords').innerText = `COORDS: ${pitch}, ${yaw}`;
    });
</script>

</body>
  </html>
