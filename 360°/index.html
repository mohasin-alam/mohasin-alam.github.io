<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker VR Tunnel - Smooth</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        :root {
            --hacker-green: #00ff41;
            --dark-bg: #000;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .viewer-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        /* Overlay Elements - Hacker Aesthetic */
        .hud-text {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--hacker-green);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
            z-index: 100;
            pointer-events: none;
        }

        .scanning-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(0, 255, 65, 0.15);
            top: 0;
            z-index: 100;
            animation: scan 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Photo controls styling - keeping it hacker style but photo is original color */
        .pnlm-control { 
            background: rgba(0, 0, 0, 0.6) !important; 
            border: 1px solid var(--hacker-green) !important; 
        }
        
        /* Green Filter Removed */
        .pnlm-render-container { filter: none !important; }
    </style>
</head>
<body>

<div class="viewer-container">
    <div class="hud-text">
        [ SYSTEM: STABLE ]<br>
        [ VIEW: ORIGINAL_MODE ]<br>
        <span id="coords">POS: 0.00° / 0.00°</span>
    </div>
    <div class="scanning-line"></div>
    
    <div id="panorama"></div>
</div>

<script>
    const viewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "picture.jpg", // আপনার ছবির ফাইল নাম
        "autoLoad": true,
        "autoRotate": -1.2,
        "compass": false,
        "hfov": 100,
        "minHfov": 50,
        "maxHfov": 120,
        
        /* Smoothness Settings */
        "friction": 0.15,      // এটি মাউস ছাড়ার পর মুভমেন্টকে স্মুথলি থামাবে
        "animationTimingFunction": "easeInOutQuad",
        "mouseZoom": true,
        "draggable": true
    });

    // স্মুথলি কোঅর্ডিনেট আপডেট
    function updateCoords() {
        let pitch = viewer.getPitch().toFixed(2);
        let yaw = viewer.getYaw().toFixed(2);
        document.getElementById('coords').innerText = `POS: ${pitch}° / ${yaw}°`;
        requestAnimationFrame(updateCoords);
    }
    updateCoords();
</script>

</body>
</html>
