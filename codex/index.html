<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কোড ব্যাখ্যাকারী — AI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b10;
    --bg2: #0d1117;
    --panel: #0f1520;
    --border: #1a2535;
    --cyan: #00f5ff;
    --green: #39ff14;
    --pink: #ff006e;
    --yellow: #ffe600;
    --purple: #bf5fff;
    --text: #c8d6e5;
    --muted: #4a5568;
    --glow-cyan: 0 0 10px #00f5ff66, 0 0 30px #00f5ff22;
    --glow-green: 0 0 10px #39ff1466, 0 0 30px #39ff1422;
    --glow-pink: 0 0 10px #ff006e66, 0 0 30px #ff006e22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
    animation: pulse 6s ease-in-out infinite alternate;
  }
  .orb1 { width: 400px; height: 400px; background: var(--cyan); top: -100px; left: -100px; }
  .orb2 { width: 300px; height: 300px; background: var(--pink); bottom: -80px; right: -80px; animation-delay: 3s; }
  .orb3 { width: 200px; height: 200px; background: var(--purple); top: 50%; left: 50%; animation-delay: 1.5s; }

  @keyframes pulse {
    from { opacity: 0.08; transform: scale(1); }
    to { opacity: 0.18; transform: scale(1.15); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 16px 60px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.7s ease;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo-bracket {
    font-size: 2rem;
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
    font-weight: 700;
  }

  h1 {
    font-family: 'Tiro Bangla', serif;
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .ai-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 12px;
    border: 1px solid var(--green);
    border-radius: 20px;
    font-size: 0.65rem;
    color: var(--green);
    text-shadow: var(--glow-green);
    box-shadow: 0 0 8px #39ff1433;
    letter-spacing: 2px;
    animation: blink-border 2s ease-in-out infinite;
  }

  @keyframes blink-border {
    0%, 100% { box-shadow: 0 0 8px #39ff1433; }
    50% { box-shadow: 0 0 20px #39ff1477; }
  }

  /* Tab switcher */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    color: var(--muted);
    font-family: 'Tiro Bangla', serif;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
  }

  .tab.active {
    background: #0d1f2d;
    border-color: var(--cyan);
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
    box-shadow: inset 0 0 15px #00f5ff0d;
  }

  .tab:hover:not(.active) {
    color: var(--text);
    border-color: var(--border);
  }

  /* Input panels */
  .input-panel {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .input-panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Code textarea */
  .code-wrap {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg2);
    transition: border-color 0.3s;
  }

  .code-wrap:focus-within {
    border-color: var(--cyan);
    box-shadow: 0 0 20px #00f5ff18;
  }

  .code-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }

  .lang-tag {
    margin-left: auto;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 2px;
  }

  textarea {
    width: 100%;
    min-height: 200px;
    background: transparent;
    border: none;
    outline: none;
    color: #a8d8ff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    padding: 14px;
    resize: vertical;
    caret-color: var(--cyan);
  }

  textarea::placeholder { color: var(--muted); }

  /* File upload */
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 50px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--bg2);
    position: relative;
  }

  .file-drop:hover, .file-drop.drag-over {
    border-color: var(--cyan);
    background: #0d1f2d;
    box-shadow: 0 0 30px #00f5ff14;
  }

  .file-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .file-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
    display: block;
  }

  .file-drop p {
    font-family: 'Tiro Bangla', serif;
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .file-drop .hint {
    font-size: 0.65rem;
    color: #2a3545;
    letter-spacing: 1px;
  }

  .file-name {
    display: none;
    margin-top: 12px;
    padding: 8px 14px;
    background: #0d2f1a;
    border: 1px solid var(--green);
    border-radius: 6px;
    color: var(--green);
    font-size: 0.75rem;
    text-shadow: var(--glow-green);
  }

  /* Explain button */
  .explain-btn {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    background: transparent;
    border: 1px solid var(--cyan);
    border-radius: 10px;
    color: var(--cyan);
    font-family: 'Tiro Bangla', serif;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    text-shadow: var(--glow-cyan);
    box-shadow: 0 0 15px #00f5ff18;
  }

  .explain-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00f5ff12, transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .explain-btn:hover::before { opacity: 1; }

  .explain-btn:hover {
    box-shadow: 0 0 30px #00f5ff44, inset 0 0 20px #00f5ff0a;
    transform: translateY(-1px);
  }

  .explain-btn:active { transform: translateY(0); }
  .explain-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Loading */
  .loader {
    display: none;
    text-align: center;
    padding: 40px;
    font-family: 'Tiro Bangla', serif;
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
  }

  .loader.active { display: block; }

  .loader-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  .loader-dots span {
    width: 8px; height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: var(--glow-cyan);
    animation: bounce 1.2s ease-in-out infinite;
  }

  .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-12px); opacity: 1; }
  }

  /* Output */
  .output-section {
    display: none;
    margin-top: 28px;
    animation: fadeIn 0.5s ease;
  }

  .output-section.active { display: block; }

  .output-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .output-title {
    font-family: 'Tiro Bangla', serif;
    color: var(--green);
    font-size: 0.95rem;
    text-shadow: var(--glow-green);
  }

  .output-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--green), transparent);
    box-shadow: 0 0 6px #39ff1444;
  }

  .output-box {
    background: var(--bg2);
    border: 1px solid #1a3a2a;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 30px #39ff1410;
  }

  .output-box-header {
    padding: 10px 16px;
    background: #0a1f12;
    border-bottom: 1px solid #1a3a2a;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.65rem;
    color: var(--green);
    letter-spacing: 2px;
  }

  .pulse-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: var(--glow-green);
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .output-content {
    padding: 22px;
    font-family: 'Tiro Bangla', serif;
    font-size: 0.97rem;
    line-height: 1.9;
    color: #d4e8d4;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Inline code in output */
  .output-content code {
    background: #0d2010;
    border: 1px solid #2a4a2a;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--cyan);
    text-shadow: 0 0 6px #00f5ff44;
  }

  /* Section headers in output */
  .output-content h3 {
    color: var(--yellow);
    text-shadow: 0 0 8px #ffe60066;
    margin: 18px 0 8px;
    font-size: 1rem;
    border-left: 3px solid var(--yellow);
    padding-left: 10px;
  }

  /* Copy button */
  .copy-btn {
    margin-top: 12px;
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'Tiro Bangla', serif;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.25s;
    float: right;
  }

  .copy-btn:hover {
    border-color: var(--green);
    color: var(--green);
    text-shadow: var(--glow-green);
  }

  /* Error */
  .error-box {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: #1a0812;
    border: 1px solid var(--pink);
    border-radius: 10px;
    color: #ff6699;
    font-family: 'Tiro Bangla', serif;
    font-size: 0.88rem;
    box-shadow: 0 0 20px #ff006e18;
  }

  .error-box.active { display: block; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Responsive */
  @media (max-width: 600px) {
    .output-content { font-size: 0.88rem; padding: 16px; }
    .tab { font-size: 0.78rem; padding: 9px 6px; }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">
  <header>
    <div class="logo-line">
      <span class="logo-bracket">{</span>
      <h1>কোড ব্যাখ্যাকারী</h1>
      <span class="logo-bracket">}</span>
    </div>
    <p class="subtitle">AI · Powered · Bengali · Code · Explainer</p>
    <span class="ai-badge">✦ CLAUDE AI POWERED ✦</span>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('type')">⌨️ সরাসরি লিখুন</button>
    <button class="tab" onclick="switchTab('upload')">📁 ফাইল আপলোড</button>
  </div>

  <!-- Type Panel -->
  <div class="input-panel active" id="panel-type">
    <div class="code-wrap">
      <div class="code-header">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
        <span class="lang-tag">CODE INPUT</span>
      </div>
      <textarea id="code-input" placeholder="এখানে আপনার কোড paste করুন...&#10;&#10;// যেকোনো ভাষার কোড হতে পারে&#10;// Python, JavaScript, C++, Java..."></textarea>
    </div>
  </div>

  <!-- Upload Panel -->
  <div class="input-panel" id="panel-upload">
    <div class="file-drop" id="file-drop">
      <input type="file" id="file-input" accept=".py,.js,.ts,.java,.cpp,.c,.html,.css,.php,.rb,.go,.rs,.txt,.json,.sh">
      <span class="file-icon">📂</span>
      <p>এখানে ফাইল drag করুন বা click করুন</p>
      <span class="hint">.py .js .java .cpp .c .html .ts .php .go — সব চলবে</span>
      <div class="file-name" id="file-name"></div>
    </div>
  </div>

  <button class="explain-btn" id="explain-btn" onclick="explainCode()">
    ⚡ বাংলায় ব্যাখ্যা করো
  </button>

  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="loader-dots">
      <span></span><span></span><span></span>
    </div>
    <span>AI কোড বিশ্লেষণ করছে...</span>
  </div>

  <!-- Error -->
  <div class="error-box" id="error-box"></div>

  <!-- Output -->
  <div class="output-section" id="output-section">
    <div class="output-header">
      <span class="output-title">✦ ব্যাখ্যা</span>
      <div class="output-line"></div>
    </div>
    <div class="output-box">
      <div class="output-box-header">
        <div class="pulse-dot"></div>
        CLAUDE AI · BENGALI OUTPUT
      </div>
      <div class="output-content" id="output-content"></div>
    </div>
    <button class="copy-btn" onclick="copyOutput()">📋 কপি করুন</button>
    <div style="clear:both"></div>
  </div>
</div>

<script>
  let currentTab = 'type';
  let fileContent = '';

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'type') || (i === 1 && tab === 'upload'));
    });
    document.querySelectorAll('.input-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
  }

  // File handling
  const fileDrop = document.getElementById('file-drop');
  const fileInput = document.getElementById('file-input');

  fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
  fileDrop.addEventListener('drop', e => {
    e.preventDefault();
    fileDrop.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) readFile(fileInput.files[0]);
  });

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      fileContent = e.target.result;
      const el = document.getElementById('file-name');
      el.style.display = 'block';
      el.textContent = '✓ ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    };
    reader.readAsText(file);
  }

  async function explainCode() {
    let code = '';

    if (currentTab === 'type') {
      code = document.getElementById('code-input').value.trim();
    } else {
      code = fileContent.trim();
    }

    if (!code) {
      showError('⚠️ কোনো কোড পাওয়া যায়নি। কোড লিখুন বা ফাইল আপলোড করুন।');
      return;
    }

    if (code.length > 15000) {
      showError('⚠️ কোড অনেক বড়। সর্বোচ্চ ১৫,০০০ অক্ষর সমর্থিত।');
      return;
    }

    clearOutput();
    setLoading(true);

    const systemPrompt = `তুমি একজন দক্ষ বাংলাভাষী প্রোগ্রামিং শিক্ষক। তোমার কাজ হলো যেকোনো কোড সহজ বাংলায় ব্যাখ্যা করা।

ব্যাখ্যার ফরম্যাট:
১. **কোড কী করে** — প্রথমে এক-দুই বাক্যে সংক্ষেপে বলো
২. **লাইন বা অংশ ধরে ব্যাখ্যা** — গুরুত্বপূর্ণ অংশ ভেঙে ভেঙে বোঝাও
৩. **ব্যবহৃত কনসেপ্ট** — কোন কোন ধারণা (loop, function, array ইত্যাদি) ব্যবহার হয়েছে
৪. **সম্ভাব্য ব্যবহার** — এই কোড কোথায় কাজে আসতে পারে

নিয়ম:
- সব উত্তর বাংলায় দাও
- Technical শব্দ (variable, function, loop ইত্যাদি) ইংরেজিতেই রাখো
- সহজ ভাষায় বোঝাও যেন নতুন শিক্ষার্থীও বুঝতে পারে
- Emoji ব্যবহার করো যেখানে উপযুক্ত`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: 'user', content: `নিচের কোডটি বাংলায় ব্যাখ্যা করো:\n\n\`\`\`\n${code}\n\`\`\`` }]
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API Error: ' + response.status);
      }

      const data = await response.json();
      const text = data.content?.map(b => b.text || '').join('') || '';

      if (!text) throw new Error('কোনো উত্তর পাওয়া যায়নি।');

      setLoading(false);
      renderOutput(text);

    } catch (err) {
      setLoading(false);
      showError('❌ ত্রুটি: ' + err.message);
    }
  }

  function renderOutput(text) {
    // Simple markdown-like rendering
    let html = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#ffe600;text-shadow:0 0 8px #ffe60066">$1</strong>')
      .replace(/^#{1,3} (.+)$/gm, '<h3>$1</h3>')
      .replace(/\n/g, '<br>');

    document.getElementById('output-content').innerHTML = html;
    document.getElementById('output-section').classList.add('active');
    document.getElementById('output-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function setLoading(state) {
    document.getElementById('loader').classList.toggle('active', state);
    document.getElementById('explain-btn').disabled = state;
  }

  function clearOutput() {
    document.getElementById('output-section').classList.remove('active');
    document.getElementById('error-box').classList.remove('active');
    document.getElementById('error-box').textContent = '';
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.classList.add('active');
  }

  function copyOutput() {
    const text = document.getElementById('output-content').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ কপি হয়েছে!';
      btn.style.borderColor = 'var(--green)';
      btn.style.color = 'var(--green)';
      setTimeout(() => {
        btn.textContent = '📋 কপি করুন';
        btn.style.borderColor = '';
        btn.style.color = '';
      }, 2000);
    });
  }
</script>
</body>
</html>
