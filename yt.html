<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>[root@downloader ~]#</title>
<style>
    body {
        background: #000;
        color: #0f0;
        font-family: 'Courier New', monospace;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    #terminal {
        padding: 20px;
        height: 100vh;
        box-sizing: border-box;
    }
    .line {
        opacity: 0;
        animation: fadeIn 0.5s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes glitch {
        0% { text-shadow: 0.05em 0 0 red, -0.05em 0 0 cyan; }
        14% { text-shadow: 0.05em 0 0 red, -0.05em 0 0 cyan; }
        15% { text-shadow: -0.05em 0 0 red, 0.05em 0 0 cyan; }
        100% { text-shadow: 0 0 0; }
    }
    .glitch { animation: glitch 1s infinite; }
    input {
        background: transparent;
        border: none;
        color: #0f0;
        font-family: inherit;
        font-size: inherit;
        outline: none;
        width: 80%;
    }
    a { color: #0f0; text-decoration: underline; }
    .cursor { animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="terminal">
    <div class="line">Initializing neural interface...</div>
    <div class="line">Bypassing YouTube DRM... <span class="glitch">[OK]</span></div>
    <div class="line">Connecting to shadow server... <span style="color:#0f0">DONE</span></div>
    <div class="line">Ready for extraction.</div>
    <br>
    <div class="line">root@yt:~# paste youtube url » 
        <input type="text" id="url" autofocus autocomplete="off" onkeydown="if(event.key==='Enter')extract()">
        <span class="cursor">_</span>
    </div>
    <div id="output"></div>
</div>

<script>
const output = document.getElementById('output');
const urlInput = document.getElementById('url');

function type(text, delay = 30) {
    let i = 0;
    return new Promise(res => {
        const interval = setInterval(() => {
            output.innerHTML += text[i++];
            if (i >= text.length) {
                clearInterval(interval);
                output.innerHTML += '<br>';
                res();
            }
        }, delay);
    });
}

async function extract() {
    const url = urlInput.value.trim();
    if (!url) return;
    
    urlInput.value = '';
    urlInput.disabled = true;

    await type(`[+] Target locked: ${url}`);
    await type('[+] Extracting video streams...');

    // এখানে wukko API ইউজ করছি (এখনো পুরোপুরি কাজ করে 2025-এ)
    const apiUrl = `https://co.wukko.me/api/v1/videos/${url}`;

    try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        await type(`[+] Title: ${data.title}`);
        await type(`[+] Duration: \( {Math.floor(data.duration/60)}m \){data.duration%60}s`);
        await type('[+] Available formats:');

        data.formats
            .filter(f => f.url && (f.qualityLabel || f.quality))
            .slice(0, 10) // প্রথম ১০টা দেখাবে
            .forEach(async (f, i) => {
                const quality = f.qualityLabel || f.quality || 'Audio';
                const size = f.fileSize ? `${(f.fileSize/1024/1024).toFixed(1)} MB` : '??';
                const link = `<a href="\( {f.url}" download target="_blank">[DOWNLOAD \){quality} - ${size}]</a>`;
                await type(`    [\( {i+1}] \){link}`);
            });

        await type('<br>[+] Extraction complete. Ready for next target.');
        await type('root@yt:~# paste youtube url » <input type="text" id="url" autofocus autocomplete="off" onkeydown="if(event.key===\'Enter\')extract()"><span class="cursor">_</span>');
        
        document.getElementById('url').focus();
        urlInput.disabled = false;

    } catch (e) {
        await type(`[-] ERROR: ${e.message || 'Target protected or offline'}`);
        await type('root@yt:~# paste youtube url » <input type="text" id="url" autofocus autocomplete="off" onkeydown="if(event.key===\'Enter\')extract()"><span class="cursor">_</span>');
        document.getElementById('url').focus();
        urlInput.disabled = false;
    }
}
</script>
</body>
</html>
