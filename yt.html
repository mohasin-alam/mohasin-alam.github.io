<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>[root@downloader ~]#</title>
<style>
    body{background:#000;color:#0f0;font-family:'Courier New',monospace;margin:0;overflow:hidden;height:100vh;}
    #terminal{padding:20px;box-sizing:border-box;height:100vh;}
    .line{opacity:0;animation:fadeIn 0.5s forwards;}
    @keyframes fadeIn{to{opacity:1;}}
    @keyframes glitch{0%,100%{text-shadow:0 0 #0f0;}50%{text-shadow:0.05em 0 red,-0.05em 0 cyan;}}
    .glitch{animation:glitch 2s infinite;}
    input{background:transparent;border:none;color:#0f0;font-family:inherit;font-size:inherit;outline:none;width:80%;}
    a{color:#0f0;text-decoration:underline;}
    .cursor{animation:blink 1s infinite;}
    @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
<div id="terminal">
    <div class="line">Booting shadow protocol v2.5...</div>
    <div class="line">Decrypting YouTube cipher... <span class="glitch">[CRACKED]</span></div>
    <div class="line">Mirrors synchronized. Breach ready.</div>
    <br>
    <div class="line">root@yt:~# paste youtube url » 
        <input type="text" id="url" autofocus autocomplete="off" onkeydown="if(event.key==='Enter')extract()">
        <span class="cursor">_</span>
    </div>
    <div id="output"></div>
</div>

<script>
const output = document.getElementById('output');
const urlInput = document.getElementById('url');

function type(text, delay=30){
    return new Promise(res => {
        let i=0;
        const int=setInterval(()=>{
            output.innerHTML += text[i++];
            if(i>=text.length){clearInterval(int);output.innerHTML+='<br>';res();}
        },delay);
    });
}

async function tryAPI(url, apiList, index=0){
    if(index >= apiList.length){
        await type('[-] Mirrors compromised. Falling back to recon mode...');
        fallbackRecon(url);
        return;
    }

    const api = apiList[index];
    await type(`[+] Activating mirror \( {index+1}/ \){apiList.length}...`);

    try{
        const res = await fetch(api.url.replace('VIDEO_URL', encodeURIComponent(url)), {method: api.method || 'GET'});
        const data = await res.json();
        if(data && (data.url || data.links || data.title)){
            api.handler(data);
            return;
        }
        throw new Error('No streams found');
    }catch(e){
        await type(`[-] Mirror \( {index+1} neutralized: \){e.message.slice(0,50)}`);
        tryAPI(url, apiList, index+1);
    }
}

async function fallbackRecon(url){
    // Fallback: YouTube Data API v3 for metadata (no key needed for public data, but limited)
    const vidId = url.split('v=')[1]?.split('&')[0];
    if(!vidId){ await type('[-] Invalid target ID'); resetInput(); return; }
    
    try{
        const apiUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,status&id=${vidId}&key=AIzaSyBOti4oFIL17UVv7kW9I9S2M9iR84fX3o`; // Public demo key (limited use)
        const res = await fetch(apiUrl);
        const data = await res.json();
        const item = data.items[0];
        if(item){
            await type(`[+] Recon complete:`);
            await type(`    Title: ${item.snippet.title}`);
            await type(`    Duration: ${item.contentDetails.duration}`);
            await type(`    Views: ${item.statistics.viewCount}`);
            await type(`    Description: ${item.snippet.description.slice(0,100)}...`);
            await type('[+] Use a VPN or premium extractor for full download. Suggestion: Try savefrom.net manually.');
        }else{
            await type('[-] Target not found or private.');
        }
    }catch(e){
        await type(`[-] Recon failed: ${e.message}`);
    }
    resetInput();
}

function resetInput(){
    output.innerHTML += '<br>root@yt:~# paste youtube url » <input type="text" id="url" autofocus onkeydown="if(event.key===\'Enter\')extract()"><span class="cursor">_</span><br>';
    setTimeout(() => document.getElementById('url')?.focus(), 100);
}

async function extract(){
    let url = urlInput.value.trim();
    if(!url)return;
    if(url.includes('youtu.be/')) url = 'https://www.youtube.com/watch?v='+url.split('/').pop().split('?')[0];
    if(!url.includes('youtube.com/watch?v=')){await type('[-] Invalid YouTube target');resetInput();return;}

    urlInput.disabled=true;
    urlInput.value='';
    
    await type(`[+] Locked: ${url.split('v=')[1]?.split('&')[0]}`);
    await type('[+] Deploying streams...');

    const apis = [
        // Mirror 1: MatheusIshiyama's free API (works Nov 2025)
        {
            url: `https://youtube-download-api.matheusishiyama.repl.co/download?videoUrl=VIDEO_URL`,
            method: 'GET',
            handler: async (data) => {
                await type(`[+] Infiltrated: ${data.title || 'Unknown'}`);
                await type('[+] Streams acquired:');
                if(data.mp4) output.innerHTML += `    [1] <a href="\( {data.mp4}" download>[MP4 \){data.quality || 'HD'} - ${(data.size/1024/1024).toFixed(1)}MB]</a><br>`;
                if(data.mp3) output.innerHTML += `    [A1] <a href="${data.mp3}" download>[MP3 High Quality]</a><br>`;
                await type('<br>[+] Breach successful. Evacuate data.');
                resetInput();
            }
        },
        // Mirror 2: VeviOz updated endpoint (reliable for 2025)
        {
            url: `https://api.vevioz.com/@api/json/mp3/VIDEO_URL`,
            method: 'GET',
            handler: async (data) => {
                await type(`[+] Title: ${data.title}`);
                await type('[+] Formats unlocked:');
                if(data.links?.mp4){
                    Object.entries(data.links.mp4).slice(0,5).forEach(([q, linkData]) => {
                        const link = linkData.a || linkData.k;
                        if(link) output.innerHTML += `    [\( {q}p] <a href=" \){link}" download>[MP4 ${q}p]</a><br>`;
                    });
                }
                if(data.links?.mp3){
                    Object.entries(data.links.mp3).slice(0,3).forEach(([q, linkData]) => {
                        const link = linkData.a || linkData.k;
                        if(link) output.innerHTML += `    [A\( {q}] <a href=" \){link}" download>[MP3 ${q}kbps]</a><br>`;
                    });
                }
                await type('<br>[+] Extraction complete.');
                resetInput();
            }
        }
    ];

    tryAPI(url, apis);
}
</script>
</body>
</html>
