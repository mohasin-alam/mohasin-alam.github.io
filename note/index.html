<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>3D Objects Fullscreen</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; position: fixed; width: 100%; height: 100%; touch-action: none; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: #00f2ff; font-family: 'Segoe UI', sans-serif; z-index: 10;
        }
        .input-group { margin-top: 10px; pointer-events: auto; }
        input { 
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00f2ff; 
            color: white; padding: 8px; border-radius: 5px; outline: none; margin: 2px;
        }
        #shape-name { font-size: 22px; color: #fff; font-weight: bold; text-shadow: 0 0 10px #00f2ff; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="shape-name">Sphere</div>
        <div class="input-group">
            <input type="text" id="titleInput" placeholder="Title + Enter...">
            <input type="text" id="textField" placeholder="Auto Focus Field...">
        </div>
        <div style="font-size: 9px; color: #777; margin-top: 8px;">
            1ST TAP: FULLSCREEN (HIDE BARS) | F1: DARK MODE
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>

    <script>
        let scene, camera, renderer, particles, geometry;
        const particleCount = 8000; 
        let currentShapeIndex = 0;
        let isDarkMode = true;

        const shapeList = ["Sphere", "Heart", "Keyboard", "Home", "Tree", "Apple", "Laptop", "Star"];

        // --- Fullscreen Logic ---
        function openFullscreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                colors[i*3] = Math.random();
                colors[i*3+1] = Math.random();
                colors[i*3+2] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.8 });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function getCoords(index, i) {
            let x = 0, y = 0, z = 0;
            const t = i / particleCount;
            const angle = t * Math.PI * 2;
            const name = shapeList[index];

            if (name === "Keyboard") {
                x = (Math.random() - 0.5) * 80; z = (Math.random() - 0.5) * 35; y = (i % 50 === 0) ? -5 : -10;
            } else if (name === "Heart") {
                x = 16 * Math.pow(Math.sin(angle), 3) * 2;
                y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * 2;
                z = (Math.random() - 0.5) * 10;
            } else {
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;
                x = 40 * Math.cos(theta) * Math.sin(phi); y = 40 * Math.sin(theta) * Math.sin(phi); z = 40 * Math.cos(phi);
            }
            return {x, y, z};
        }

        // --- Events ---
        document.getElementById('titleInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('textField').focus();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'F1') {
                e.preventDefault();
                isDarkMode = !isDarkMode;
                document.body.style.background = isDarkMode ? "#000" : "#111";
            }
        });

        // ট্যাপ করলে ফুলস্ক্রিন হবে এবং শেপ বদলাবে
        window.addEventListener('touchend', (e) => {
            openFullscreen(); // টাইটেল বার হাইড করার জন্য
            if (e.target.tagName !== 'INPUT') {
                currentShapeIndex = (currentShapeIndex + 1) % shapeList.length;
                document.getElementById('shape-name').innerText = shapeList[currentShapeIndex];
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            const pos = geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                const target = getCoords(currentShapeIndex, i);
                pos[idx] += (target.x - pos[idx]) * 0.1;
                pos[idx+1] += (target.y - pos[idx+1]) * 0.1;
                pos[idx+2] += (target.z - pos[idx+2]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.005;
            renderer.render(scene, camera);
        }

        initThree();
        animate();
    </script>
</body>
</html>
