<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Notepad (CSM_MOHASIN_ALAM)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-color: #000; 
            --terminal-bg: #111; 
            --text-color: #00ff41; 
            --primary-color: #00ff41; 
            --secondary-color: #222; 
            --accent-color: #00c62e; 
            --danger-color: #ff005c; 
            --border-color: #005f15; 
            --hover-bg: #003300; 
            --font-mono: 'Courier New', Courier, monospace;
            --neon-pink: #ff007f; 
            --header-height: 60px; 
            --footer-height: 40px;
        }

        body.light-mode {
            --bg-color: #e0e0e0; 
            --terminal-bg: #f0f0f0; 
            --text-color: #333; 
            --primary-color: #007acc; 
            --secondary-color: #ccc; 
            --border-color: #bbb; 
            --hover-bg: #d0d0d0;
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            height: 100dvh; display: flex;
            justify-content: center; align-items: center;
            overflow: hidden;
        }

        * { box-sizing: border-box; color: var(--text-color); }

        #auth-container {
            max-width: 400px; padding: 30px;
            border: 2px solid var(--border-color);
            background-color: var(--terminal-bg);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        #notepad-container {
            width: 100vw; height: 100dvh;
            display: flex; flex-direction: column;
            background-color: var(--terminal-bg);
        }

        #app-header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px;
        }

        #note-app-layout { display: flex; flex-grow: 1; overflow: hidden; }

        #notes-list {
            width: 30%; border-right: 1px solid var(--border-color);
            overflow-y: auto; padding: 10px;
        }

        #note-editor { width: 70%; padding: 20px; display: flex; flex-direction: column; }

        textarea {
            flex-grow: 1; background: transparent;
            border: none; outline: none; resize: none;
            font-size: 1rem; line-height: 1.6;
            color: var(--neon-pink);
        }

        input[type="text"] {
            background: transparent; border: none;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.2rem; margin-bottom: 10px; padding: 5px;
        }

        .custom-button, button {
            padding: 8px 15px; border: 1px solid var(--primary-color);
            background: transparent; cursor: pointer;
            margin: 5px; font-family: var(--font-mono);
        }

        .note-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #222; }
        .note-item.kb-highlight { background-color: var(--primary-color) !important; color: var(--bg-color) !important; }
        .note-item.active { border-left: 4px solid var(--neon-pink); background: var(--hover-bg); }

        #control-bar {
            height: var(--footer-height); border-top: 1px solid var(--border-color);
            display: flex; align-items: center; padding: 0 10px; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <h2>:: CONNECTION REQUIRED ::</h2>
        <input type="email" id="email-input" placeholder="EMAIL" style="width:100%; margin-bottom:10px; background:#000; border:1px solid var(--border-color); padding:10px;">
        <input type="password" id="password-input" placeholder="PASSWORD" style="width:100%; margin-bottom:15px; background:#000; border:1px solid var(--border-color); padding:10px;">
        <button class="custom-button" onclick="loginUser()">LOGIN [ENTER]</button>
    </div>

    <div id="notepad-container" style="display: none;">
        <div id="app-header">
            <h3>SECURE_SHELL (DEV: MOHASIN)</h3>
            <div>
                <button class="custom-button" onclick="createNewNote()">NEW [CTRL+M]</button>
                <button class="custom-button" onclick="logoutUser()">EXIT</button>
                <button onclick="toggleDarkMode()">☀️/🌙 [F1]</button>
            </div>
        </div>
        
        <div id="note-app-layout">
            <div id="notes-list"></div>
            <div id="note-editor">
                <input type="text" id="note-title" placeholder="TITLE (Enter to go Body)...">
                <textarea id="note-text" placeholder="TYPE DATA..."></textarea>
                <input type="hidden" id="current-note-id">
            </div>
        </div>

        <div id="control-bar">
            <button class="custom-button" onclick="saveNote()">SAVE [CTRL+S]</button>
            <span id="save-status" style="margin-left: 20px;">:: SYSTEM READY ::</span>
            <span style="margin-left: auto; opacity: 0.7;">F1: Mode | ARROWS: Select | ENTER: Open | <b>CTRL+Q: Focus List</b></span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCyBfxasE2hwuthXu56VuHa7LWpybVFXhc",
            authDomain: "emailnotepad-28faa.firebaseapp.com",
            databaseURL: "https://emailnotepad-28faa-default-rtdb.firebaseio.com",
            projectId: "emailnotepad-28faa",
            storageBucket: "emailnotepad-28faa.firebasestorage.app",
            messagingSenderId: "61372668462",
            appId: "1:61372668462:web:0f4eb4355974b2e2579dbf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let currentUserId = null;
        let selectedIndex = -1;

        // --- Keyboard Logic ---
        document.addEventListener('keydown', (e) => {
            const notes = document.querySelectorAll('.note-item');

            // F1: Mode Toggle
            if (e.key === 'F1') { e.preventDefault(); toggleDarkMode(); }

            // Ctrl + S: Save
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNote(); }

            // Ctrl + M: New Note
            if ((e.ctrlKey || e.metaKey) && e.key === 'm') { e.preventDefault(); createNewNote(); }

            // Ctrl + Q: Focus List (Note selecting mode)
            if ((e.ctrlKey || e.metaKey) && e.key === 'q') {
                e.preventDefault();
                document.activeElement.blur(); 
                selectedIndex = 0;
                updateVisualSelection();
            }

            // Arrow Key Navigation (When not typing)
            if (document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = (selectedIndex + 1) % notes.length;
                    updateVisualSelection();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = (selectedIndex - 1 + notes.length) % notes.length;
                    updateVisualSelection();
                } else if (e.key === 'Enter' && selectedIndex !== -1) {
                    e.preventDefault();
                    notes[selectedIndex].click();
                    document.getElementById('note-text').focus();
                }
            }
        });

        // Title field Enter key
        document.getElementById('note-title').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('note-text').focus();
            }
        });

        function updateVisualSelection() {
            const notes = document.querySelectorAll('.note-item');
            notes.forEach((n, i) => {
                n.classList.toggle('kb-highlight', i === selectedIndex);
                if(i === selectedIndex) n.scrollIntoView({ block: 'nearest' });
            });
        }

        // --- Functions ---
        function toggleDarkMode() { document.body.classList.toggle('light-mode'); }
        function loginUser() {
            const e = document.getElementById('email-input').value;
            const p = document.getElementById('password-input').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }
        function logoutUser() { auth.signOut(); }
        
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('notepad-container').style.display = 'flex';
                loadAllNotes(user.uid);
            } else { location.reload(); }
        });

        function loadAllNotes(uid) {
            db.ref(`notes/${uid}`).on('value', snap => {
                const list = document.getElementById('notes-list');
                list.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, note]) => {
                        const div = document.createElement('div');
                        div.className = 'note-item';
                        div.innerText = `> ${note.title || 'Untitled'}`;
                        div.onclick = () => {
                            document.getElementById('current-note-id').value = id;
                            document.getElementById('note-title').value = note.title;
                            document.getElementById('note-text').value = note.text;
                            document.querySelectorAll('.note-item').forEach(i => i.classList.remove('active'));
                            div.classList.add('active');
                        };
                        list.appendChild(div);
                    });
                }
            });
        }

        function saveNote() {
            if (!currentUserId) return;
            const id = document.getElementById('current-note-id').value;
            const title = document.getElementById('note-title').value;
            const text = document.getElementById('note-text').value;
            const status = document.getElementById('save-status');
            const noteData = { title, text, timestamp: Date.now() };
            status.innerText = ":: SAVING... ::";
            if (id) {
                db.ref(`notes/${currentUserId}/${id}`).update(noteData);
            } else {
                const newRef = db.ref(`notes/${currentUserId}`).push();
                newRef.set(noteData);
                document.getElementById('current-note-id').value = newRef.key;
            }
            setTimeout(() => status.innerText = ":: SYSTEM READY ::", 1000);
        }

        function createNewNote() {
            document.getElementById('current-note-id').value = '';
            document.getElementById('note-title').value = '';
            document.getElementById('note-text').value = '';
            document.getElementById('note-title').focus();
        }

        window.onload = () => { window.scrollTo(0, 1); };
    </script>
</body>
</html>
