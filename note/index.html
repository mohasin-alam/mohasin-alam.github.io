<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Email Notepad (Hacker Terminal)</title>
    
    <style>
        /* --- থিম ভেরিয়েবলস --- */
        :root {
            --bg-color: #000; 
            --terminal-bg: #111; 
            --text-color: #00ff41; 
            --primary-color: #00ff41; 
            --secondary-color: #222; 
            --accent-color: #00c62e; 
            --danger-color: #ff005c; 
            --border-color: #005f15; 
            --hover-bg: #003300; 
            --font-mono: 'Courier New', Courier, monospace;

            /* নিয়ন কালার ভেরিয়েবল (অ্যানিমেশনের জন্য) */
            --neon-lime: #00ff41;
            --neon-pink: #ff007f; 
            --animation-duration: 3s; 
        }

        /* --- কালার অ্যানিমেশন --- */
        @keyframes neonGlow {
            0% { 
                color: var(--neon-lime); 
                text-shadow: 0 0 5px var(--neon-lime), 0 0 10px var(--neon-lime); 
            }
            50% { 
                color: var(--neon-pink); 
                text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink); 
            }
            100% { 
                color: var(--neon-lime); 
                text-shadow: 0 0 5px var(--neon-lime), 0 0 10px var(--neon-lime); 
            }
        }

        /* --- গ্লোবাল স্টাইল: টার্মিনাল লুক এবং অ্যানিমেশন প্রয়োগ --- */
        body {
            font-family: var(--font-mono);
            padding: 0;
            margin: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* গ্লোবাল টেক্সট অ্যানিমেশন */
            animation: neonGlow var(--animation-duration) infinite alternate; 
        }

        /* সকল ফন্ট এবং বর্ডার ফিক্সিং */
        * {
            font-family: var(--font-mono);
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        /* --- লগইন কন্টেইনার স্টাইল --- */
        #auth-container {
            max-width: 400px;
            padding: 30px;
            border: 2px solid var(--border-color);
            border-radius: 0; 
            background-color: var(--terminal-bg);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); 
        }
        
        /* --- নোটপ্যাড কন্টেইনার (অ্যাপের মতো) --- */
        #notepad-container {
            width: 95%; 
            max-width: 1200px; 
            height: 95vh; 
            padding: 0; 
            border: 2px solid var(--border-color);
            border-radius: 0;
            background-color: var(--terminal-bg);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* --- ইনপুট এবং টেক্সটের বেস স্টাইল --- */
        input[type="email"], input[type="password"], 
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 0;
            background-color: var(--bg-color);
            /* কালার অ্যানিমেশন body থেকে পাবে */
            text-shadow: 0 0 3px var(--text-color);
            caret-color: var(--primary-color); 
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 5px var(--primary-color);
        }

        textarea {
            flex-grow: 1; 
            height: auto;
            border: none;
            background-color: transparent;
            padding: 10px 0;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
        }

        /* --- বাটন স্টাইল এবং অ্যানিমেশন ফিক্স --- */
        button {
            padding: 10px 12px;
            margin-right: 10px;
            border: 1px solid var(--primary-color);
            border-radius: 0;
            cursor: pointer;
            font-weight: bold;
            background-color: transparent;
            text-shadow: 0 0 3px var(--text-color);
            transition: background-color 0.2s, color 0.2s;
            animation: neonGlow var(--animation-duration) infinite alternate; /* বাটন টেক্সট অ্যানিমেশন */
        }

        button:hover {
            background-color: var(--hover-bg);
            color: var(--primary-color); /* হোভারে লাইম ফিক্স */
            text-shadow: 0 0 3px var(--primary-color);
            animation: none; /* হোভারে অ্যানিমেশন বন্ধ */
        }
        
        /* নির্দিষ্ট রঙের বাটনগুলির অ্যানিমেশন বন্ধ */
        #auth-container button:nth-child(5), /* রেজিস্টার */
        #notepad-container button[onclick="logoutUser()"], /* লগআউট */
        #notepad-container button[onclick="deleteNote()"] /* ডিলিট */
        {
            animation: none;
        }
        
        #auth-container button {
            border-color: var(--primary-color);
        }
        #auth-container button:nth-child(5) { 
            border-color: #555;
            color: #555;
        }
        
        #notepad-container button[onclick="saveNote()"] {
            border-color: var(--accent-color);
        }
        #notepad-container button[onclick="deleteNote()"] {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }
        #notepad-container button[onclick="logoutUser()"] {
            border-color: #555;
            color: #555;
        }
        
        /* --- হেডার এবং কন্ট্রোল বার --- */
        #app-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--terminal-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #control-bar {
            background-color: var(--terminal-bg);
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-shrink: 0; 
        }

        /* --- নোট লিস্ট এবং এডিটর লেআউট --- */
        #note-app-layout {
            display: flex;
            flex-grow: 1; 
            overflow: hidden;
        }

        #notes-list {
            width: 280px; 
            min-width: 250px;
            border-right: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto; 
            background-color: var(--terminal-bg);
            flex-shrink: 0;
        }
        
        #note-editor {
            flex-grow: 1; 
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        
        #note-editor input[type="text"] {
            font-size: 1.2rem; 
            font-weight: bold;
            padding: 5px 0;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background-color: transparent;
            margin-bottom: 10px;
        }

        /* --- নোট আইটেম স্টাইল --- */
        .note-item {
            padding: 8px 10px;
            margin-bottom: 5px;
            border-radius: 0;
            cursor: pointer;
            transition: background-color 0.2s;
            border-left: 3px solid transparent;
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }

        .note-item:hover {
            background-color: var(--hover-bg);
        }

        .note-item.active { 
            background-color: var(--hover-bg);
            border-left: 3px solid var(--primary-color);
            font-weight: bold;
        }
        
        #save-status {
            margin-left: 10px;
            font-weight: bold;
            text-shadow: 0 0 3px var(--primary-color);
        }
        
        /* ছোট স্ক্রিনের জন্য রেসপনসিভ স্টাইল */
        @media (max-width: 768px) {
            #notepad-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            /* হেডার অংশ ফিক্সড */
            #app-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px;
            }
            #app-header h2 {
                margin-bottom: 5px;
            }
            .header-controls {
                width: 100%;
                display: flex; 
                justify-content: space-between;
                margin-top: 10px;
            }
            .header-controls button {
                width: 48%; 
                margin-right: 0;
                margin-left: 0 !important;
            }
            
            /* মূল লেআউট ফিক্স */
            #note-app-layout {
                flex-direction: column;
            }
            #notes-list {
                width: auto;
                height: 120px; 
                max-height: 120px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 10px;
            }
            #note-editor {
                width: auto;
                padding: 10px;
            }
            /* কন্ট্রোল বার ফিক্স */
            #control-bar {
                padding: 10px;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            #control-bar button {
                width: 48%; 
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div id="auth-container">
        <h2>:: INITIATING CONNECTION ::</h2>
        <input type="email" id="email-input" placeholder="USERNAME/EMAIL">
        <input type="password" id="password-input" placeholder="PASSWORD">
        <button onclick="loginUser()">LOGIN [ENTER]</button>
        <button onclick="signupUser()">REGISTER NEW USER</button>
        <p id="auth-error" style="color: var(--danger-color); text-shadow: none;"></p>
    </div>

    <div id="notepad-container" style="display: none;">
        
        <div id="app-header">
            <h2 id="welcome-message">SECURE_NOTES.TXT</h2>
            <div class="header-controls">
                <button onclick="createNewNote()">:: NEW NOTE ::</button>
                <button onclick="logoutUser()">:: EXIT ::</button>
            </div>
        </div>
        
        <div id="note-app-layout">
            
            <div id="notes-list">
                <p style="padding: 10px;">:: LOADING NOTES ::</p>
            </div>
            
            <div id="note-editor">
                <input type="text" id="note-title" placeholder="ENTER NOTE TITLE" value="" required>
                <textarea id="note-text" placeholder="START TYPING YOUR DATA..." onkeyup="resetAutoSaveTimer()"></textarea>
                
                <input type="hidden" id="current-note-id" value=""> 
            </div>
        </div>
        
        <div id="control-bar">
            <button onclick="saveNote()">:: SAVE (CTRL+S) ::</button>
            <button onclick="deleteNote()" id="delete-btn" style="display: none;">:: DELETE ::</button>
            <p id="save-status"></p>
        </div>
        
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // কনফিগারেশন: আপনার টাস্ক ৪ থেকে নেওয়া মানগুলি
        const firebaseConfig = {
            apiKey: "AIzaSyCyBfxasE2hwuthXu56VuHa7LWpybVFXhc",
            authDomain: "emailnotepad-28faa.firebaseapp.com",
            databaseURL: "https://emailnotepad-28faa-default-rtdb.firebaseio.com", 
            projectId: "emailnotepad-28faa",
            storageBucket: "emailnotepad-28faa.firebasestorage.app",
            messagingSenderId: "61372668462",
            appId: "1:61372668462:web:0f4eb4355974b2e2579dbf",
            measurementId: "G-J73FP94J27"
        };

        // Firebase ইনিশিয়ালাইজ করুন
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database(); 

        let currentUserId = null;
        let autoSaveTimer = null; 
        const AUTO_SAVE_DELAY = 2000; 

        // --- AUTH লজিক ---
        
        function signupUser() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            document.getElementById('auth-error').textContent = '';
            
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById('auth-error').textContent = '>> REGISTRATION SUCCESS. PLEASE LOGIN.';
                })
                .catch((error) => {
                    document.getElementById('auth-error').textContent = '>> ERROR: ' + error.message;
                });
        }

        function loginUser() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            document.getElementById('auth-error').textContent = '';
            
            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    document.getElementById('auth-error').textContent = '>> ERROR: ' + error.message;
                });
        }

        function logoutUser() {
            auth.signOut();
        }

        // --- অটো-সেভ লজিক ---

        function resetAutoSaveTimer() {
            clearTimeout(autoSaveTimer);
            
            autoSaveTimer = setTimeout(() => {
                const title = document.getElementById('note-title').value.trim();
                const text = document.getElementById('note-text').value.trim();
                
                if (title || text) {
                    saveNote(true); 
                }
            }, AUTO_SAVE_DELAY);
        }
        
        // --- নোটপ্যাড লজিক ---
        
        function createNewNote() {
            document.getElementById('note-title').value = '';
            document.getElementById('note-text').value = '';
            document.getElementById('current-note-id').value = ''; 
            document.getElementById('delete-btn').style.display = 'none';
            document.getElementById('save-status').textContent = ':: NEW_NOTE CREATED. TYPE TO BEGIN ::';
            
            document.querySelectorAll('.note-item').forEach(item => {
                item.classList.remove('active');
            });
        }

        function saveNote(isAutoSave = false) {
            const title = document.getElementById('note-title').value.trim();
            const text = document.getElementById('note-text').value;
            const noteId = document.getElementById('current-note-id').value;
            
            if (!title && !text) { 
                return; 
            }

            const noteData = {
                title: title || "[UNTITLED NOTE]", 
                text: text,
                timestamp: new Date().toISOString()
            };

            const statusElement = document.getElementById('save-status');
            statusElement.textContent = isAutoSave ? ':: AUTO-SAVING... ::' : ':: MANUAL SAVE INITIATED ::';

            let noteRef;
            
            if (noteId) {
                // পুরানো নোট আপডেট করা
                noteRef = db.ref(`notes/${currentUserId}/${noteId}`);
                noteRef.update(noteData)
                    .then(() => {
                        statusElement.textContent = isAutoSave ? ':: AUTO-SAVE SUCCESSFUL ::' : ':: SAVE SUCCESSFUL ::';
                    });

            } else {
                // নতুন নোট তৈরি করা
                noteRef = db.ref(`notes/${currentUserId}`).push();
                noteRef.set(noteData)
                    .then(() => {
                        document.getElementById('current-note-id').value = noteRef.key; 
                        document.getElementById('delete-btn').style.display = 'inline-block';
                        statusElement.textContent = isAutoSave ? ':: AUTO-SAVE SUCCESSFUL ::' : ':: SAVE SUCCESSFUL ::';
                    });
            }
        }

        function loadNoteForEditing(noteId, title, text) {
            document.getElementById('current-note-id').value = noteId;
            document.getElementById('note-title').value = title;
            document.getElementById('note-text').value = text;
            document.getElementById('delete-btn').style.display = 'inline-block';
            document.getElementById('save-status').textContent = `:: FILE LOADED: ${title.toUpperCase()} ::`;

            document.querySelectorAll('.note-item').forEach(item => {
                item.classList.remove('active');
            });
            document.getElementById(`item-${noteId}`).classList.add('active');
        }

        function deleteNote() {
            const noteId = document.getElementById('current-note-id').value;
            if (noteId && confirm(":: WARNING: DELETE SELECTED FILE? (Y/N) ::")) {
                db.ref(`notes/${currentUserId}/${noteId}`).remove()
                    .then(() => {
                        document.getElementById('save-status').textContent = ':: FILE DELETED SUCCESSFULLY ::';
                        createNewNote(); 
                    })
                    .catch((error) => {
                        document.getElementById('save-status').textContent = ':: ERROR DELETING FILE ::';
                    });
            }
        }

        function loadAllNotes(userId) {
            const notesListDiv = document.getElementById('notes-list');
            notesListDiv.innerHTML = '<p style="padding: 10px; color: #aaa;">:: INITIATING DATA RETRIEVAL ::</p>';

            db.ref(`notes/${userId}`).on('value', (snapshot) => {
                notesListDiv.innerHTML = '';
                const notes = snapshot.val();
                let hasNotes = false;
                let activeNoteId = document.getElementById('current-note-id').value; 

                if (notes) {
                    const sortedNotes = Object.entries(notes).sort(([, a], [, b]) => new Date(b.timestamp) - new Date(a.timestamp));
                    
                    sortedNotes.forEach(([noteId, note]) => {
                        hasNotes = true;
                        const item = document.createElement('div');
                        item.id = `item-${noteId}`;
                        item.classList.add('note-item');
                        item.textContent = `> ${note.title}`;
                        
                        item.onclick = () => loadNoteForEditing(noteId, note.title, note.text);
                        notesListDiv.appendChild(item);
                    });
                    
                    if (!activeNoteId) {
                        const firstNoteId = sortedNotes[0][0];
                        const firstNote = sortedNotes[0][1];
                        loadNoteForEditing(firstNoteId, firstNote.title, firstNote.text);
                    } else {
                        const activeItem = document.getElementById(`item-${activeNoteId}`);
                        if (activeItem) {
                            activeItem.classList.add('active');
                        } else {
                            const firstNoteId = sortedNotes[0][0];
                            const firstNote = sortedNotes[0][1];
                            loadNoteForEditing(firstNoteId, firstNote.title, firstNote.text);
                        }
                    }

                } else {
                    notesListDiv.innerHTML = '<p style="padding: 10px; color: #aaa;">:: NO FILES FOUND. CREATE NEW. ::</p>';
                    createNewNote(); 
                }
            });
        }

        // Auth State Change লিসেনার 
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('notepad-container').style.display = 'flex';
                document.getElementById('welcome-message').textContent = `ACCESS GRANTED: USER@${user.email.split('@')[0].toUpperCase()}.TXT`;
                
                loadAllNotes(user.uid); 
            } else {
                currentUserId = null;
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('notepad-container').style.display = 'none';
            }
        });

        // কী-প্রেস ইভেন্ট লিসেনার যোগ করা
        document.addEventListener('DOMContentLoaded', () => {
            const noteTextarea = document.getElementById('note-text');
            const noteTitle = document.getElementById('note-title');
            
            if (noteTextarea) noteTextarea.addEventListener('keyup', resetAutoSaveTimer);
            if (noteTitle) noteTitle.addEventListener('keyup', resetAutoSaveTimer);
        });
    </script>
</body>
</html>
