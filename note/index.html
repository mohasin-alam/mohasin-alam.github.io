<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Email Notepad (Hacker Terminal)</title>
    
    <style>
        /* --- থিম ভেরিয়েবলস --- */
        :root {
            --bg-color: #000; 
            --terminal-bg: #111; 
            --text-color: #00ff41; 
            --primary-color: #00ff41; 
            --secondary-color: #222; 
            --accent-color: #00c62e; 
            --danger-color: #ff005c; 
            --border-color: #005f15; 
            --hover-bg: #003300; 
            --font-mono: 'Courier New', Courier, monospace;
            --neon-pink: #ff007f; 
            --header-height: 60px; 
            --footer-height: 40px;
        }

        body.light-mode {
            --bg-color: #e0e0e0; 
            --terminal-bg: #f0f0f0; 
            --text-color: #333; 
            --primary-color: #007acc; 
            --secondary-color: #ccc; 
            --border-color: #bbb; 
            --hover-bg: #d0d0d0;
        }

        @keyframes neonGlow {
            0% { color: var(--primary-color); text-shadow: 0 0 5px var(--primary-color); }
            50% { color: var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink); }
            100% { color: var(--primary-color); text-shadow: 0 0 5px var(--primary-color); }
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            height: 100vh; display: flex;
            justify-content: center; align-items: center;
            overflow: hidden;
        }

        * { box-sizing: border-box; color: var(--text-color); }

        /* --- লেআউট --- */
        #auth-container {
            max-width: 400px; padding: 30px;
            border: 2px solid var(--border-color);
            background-color: var(--terminal-bg);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        #notepad-container {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background-color: var(--terminal-bg);
        }

        #app-header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px;
        }

        #note-app-layout {
            display: flex; flex-grow: 1; overflow: hidden;
        }

        #notes-list {
            width: 30%; border-right: 1px solid var(--border-color);
            overflow-y: auto; padding: 10px;
        }

        #note-editor {
            width: 70%; padding: 20px;
            display: flex; flex-direction: column;
        }

        textarea {
            flex-grow: 1; background: transparent;
            border: none; outline: none; resize: none;
            font-size: 1rem; line-height: 1.6;
            color: var(--neon-pink);
        }

        input[type="text"] {
            background: transparent; border: none;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.2rem; margin-bottom: 10px; padding: 5px;
        }

        /* --- বাটন ও ইন্টারঅ্যাকশন --- */
        .custom-button, button {
            padding: 8px 15px; border: 1px solid var(--primary-color);
            background: transparent; cursor: pointer;
            margin: 5px; font-family: var(--font-mono);
        }

        .custom-button:hover, .custom-button:focus {
            background: var(--primary-color); color: var(--bg-color);
        }

        .note-item {
            padding: 10px; cursor: pointer;
            border-bottom: 1px solid #222;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .note-item.active {
            background-color: var(--hover-bg);
            border-left: 4px solid var(--primary-color);
        }

        .note-item.kb-highlight {
            background-color: var(--primary-color) !important;
            color: var(--bg-color) !important;
        }

        #control-bar {
            height: var(--footer-height);
            border-top: 1px solid var(--border-color);
            display: flex; align-items: center; padding: 0 10px;
            font-size: 0.8rem;
        }

        #custom-confirm-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <h2 style="animation: neonGlow 3s infinite;">:: CONNECTION REQUIRED ::</h2>
        <input type="email" id="email-input" placeholder="EMAIL" style="width:100%; margin-bottom:10px; background:#000; border:1px solid var(--border-color); padding:10px;">
        <input type="password" id="password-input" placeholder="PASSWORD" style="width:100%; margin-bottom:15px; background:#000; border:1px solid var(--border-color); padding:10px;">
        <button class="custom-button" onclick="loginUser()">LOGIN [ENTER]</button>
        <button class="custom-button" onclick="signupUser()">SIGNUP</button>
        <p id="auth-error" style="color: var(--danger-color); font-size: 0.8rem;"></p>
    </div>

    <div id="notepad-container" style="display: none;">
        <div id="app-header">
            <h3 id="welcome-message">SECURE_SHELL</h3>
            <div>
                <button class="custom-button" onclick="createNewNote()">NEW [CTRL+M]</button>
                <button class="custom-button" onclick="logoutUser()">EXIT</button>
                <button onclick="toggleDarkMode()">☀️/🌙</button>
            </div>
        </div>
        
        <div id="note-app-layout">
            <div id="notes-list"></div>
            <div id="note-editor">
                <input type="text" id="note-title" placeholder="TITLE...">
                <textarea id="note-text" placeholder="TYPE DATA..."></textarea>
                <input type="hidden" id="current-note-id">
            </div>
        </div>

        <div id="control-bar">
            <button class="custom-button" onclick="saveNote()" style="border-color: var(--accent-color);">SAVE [CTRL+S]</button>
            <button class="custom-button" onclick="deleteNote()" id="delete-btn" style="border-color: var(--danger-color); display:none;">DEL [CTRL+D]</button>
            <span id="save-status" style="margin-left: 20px; opacity: 0.7;">:: SYSTEM READY ::</span>
            <span style="margin-left: auto; opacity: 0.5;">ARROWS: Nav | ENTER: Open | CTRL+L: Focus List</span>
        </div>
    </div>

    <div id="custom-confirm-overlay">
        <div style="background: var(--terminal-bg); padding: 30px; border: 2px solid var(--danger-color); text-align:center;">
            <p>DELETE PERMANENTLY? (Y/N)</p>
            <button class="custom-button" onclick="confirmDelete(true)" id="confirm-yes">YES [ENTER]</button>
            <button class="custom-button" onclick="confirmDelete(false)">NO [ESC]</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCyBfxasE2hwuthXu56VuHa7LWpybVFXhc",
            authDomain: "emailnotepad-28faa.firebaseapp.com",
            databaseURL: "https://emailnotepad-28faa-default-rtdb.firebaseio.com",
            projectId: "emailnotepad-28faa",
            storageBucket: "emailnotepad-28faa.firebasestorage.app",
            messagingSenderId: "61372668462",
            appId: "1:61372668462:web:0f4eb4355974b2e2579dbf"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let currentUserId = null;
        let selectedIndex = -1;
        let autoSaveTimer = null;

        // --- কিবোর্ড কন্ট্রোল লজিক ---
        document.addEventListener('keydown', (e) => {
            // ১. সেভ (Ctrl + S)
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveNote();
            }
            // ২. নিউ নোট (Ctrl + M)
            if ((e.ctrlKey || e.metaKey) && e.key === 'm') {
                e.preventDefault();
                createNewNote();
                document.getElementById('note-title').focus();
            }
            // ৩. ডিলিট (Ctrl + D)
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                deleteNote();
            }
            // ৪. নোট লিস্ট ফোকাস (Ctrl + L)
            if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                e.preventDefault();
                document.activeElement.blur();
                selectedIndex = 0;
                updateVisualSelection();
            }
            // ৫. অ্যারো কি নেভিগেশন (যখন ইনপুটে নেই)
            if (document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
                const notes = document.querySelectorAll('.note-item');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = (selectedIndex + 1) % notes.length;
                    updateVisualSelection();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = (selectedIndex - 1 + notes.length) % notes.length;
                    updateVisualSelection();
                } else if (e.key === 'Enter' && selectedIndex !== -1) {
                    e.preventDefault();
                    notes[selectedIndex].click();
                    document.getElementById('note-text').focus();
                }
            }
            // ৬. কনফার্মেশন বক্স ক্লোজ (Esc)
            if (e.key === 'Escape') hideCustomConfirm();
        });

        function updateVisualSelection() {
            const notes = document.querySelectorAll('.note-item');
            notes.forEach((n, i) => {
                n.classList.toggle('kb-highlight', i === selectedIndex);
                if(i === selectedIndex) n.scrollIntoView({ block: 'nearest' });
            });
        }

        // --- কোর ফাংশনালিটি ---
        function loginUser() {
            const e = document.getElementById('email-input').value;
            const p = document.getElementById('password-input').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => document.getElementById('auth-error').innerText = err.message);
        }

        function signupUser() {
            const e = document.getElementById('email-input').value;
            const p = document.getElementById('password-input').value;
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("Success! Now Login."));
        }

        function logoutUser() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('notepad-container').style.display = 'flex';
                loadAllNotes(user.uid);
            } else {
                location.reload();
            }
        });

        function loadAllNotes(uid) {
            db.ref(`notes/${uid}`).on('value', snap => {
                const list = document.getElementById('notes-list');
                list.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, note]) => {
                        const div = document.createElement('div');
                        div.className = 'note-item';
                        div.id = `item-${id}`;
                        div.innerText = `> ${note.title || 'Untitled'}`;
                        div.onclick = () => {
                            document.getElementById('current-note-id').value = id;
                            document.getElementById('note-title').value = note.title;
                            document.getElementById('note-text').value = note.text;
                            document.getElementById('delete-btn').style.display = 'inline-block';
                            document.querySelectorAll('.note-item').forEach(i => i.classList.remove('active'));
                            div.classList.add('active');
                        };
                        list.appendChild(div);
                    });
                }
            });
        }

        function saveNote() {
            if (!currentUserId) return;
            const id = document.getElementById('current-note-id').value;
            const title = document.getElementById('note-title').value;
            const text = document.getElementById('note-text').value;
            const status = document.getElementById('save-status');

            const noteData = { title, text, timestamp: firebase.database.ServerValue.TIMESTAMP };
            status.innerText = ":: SAVING... ::";

            if (id) {
                db.ref(`notes/${currentUserId}/${id}`).update(noteData);
            } else {
                const newRef = db.ref(`notes/${currentUserId}`).push();
                newRef.set(noteData);
                document.getElementById('current-note-id').value = newRef.key;
            }
            status.innerText = ":: SUCCESS ::";
            setTimeout(() => status.innerText = ":: SYSTEM READY ::", 2000);
        }

        function createNewNote() {
            document.getElementById('current-note-id').value = '';
            document.getElementById('note-title').value = '';
            document.getElementById('note-text').value = '';
            document.getElementById('delete-btn').style.display = 'none';
            document.getElementById('note-title').focus();
        }

        function deleteNote() {
            if (document.getElementById('current-note-id').value) {
                document.getElementById('custom-confirm-overlay').style.display = 'flex';
                document.getElementById('confirm-yes').focus();
            }
        }

        function confirmDelete(confirm) {
            const id = document.getElementById('current-note-id').value;
            if (confirm && id) {
                db.ref(`notes/${currentUserId}/${id}`).remove();
                createNewNote();
            }
            hideCustomConfirm();
        }

        function hideCustomConfirm() { document.getElementById('custom-confirm-overlay').style.display = 'none'; }
        
        function toggleDarkMode() { document.body.classList.toggle('light-mode'); }

        // অটো-সেভ লজিক
        document.getElementById('note-text').addEventListener('input', () => {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveNote, 1000);
        });
    </script>
</body>
</html>
