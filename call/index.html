<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexCall - Pro WebRTC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- 1. VARIABLES & RESET --- */
        :root {
            --bg-dark: #0f172a;       /* Slate 900 */
            --bg-panel: #1e293b;      /* Slate 800 */
            --primary: #6366f1;       /* Indigo 500 */
            --primary-hover: #4f46e5; /* Indigo 600 */
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 2. LOBBY / LOGIN (Modal) --- */
        #lobby-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .lobby-card {
            background: var(--bg-panel);
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
        }
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
        input {
            width: 100%; padding: 12px;
            background: #0f172a; border: 1px solid #334155;
            color: white; border-radius: 8px; font-size: 1rem;
        }
        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer;
            transition: transform 0.1s;
            font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); }

        /* --- 3. MAIN LAYOUT (Responsive) --- */
        #app-container {
            flex: 1;
            display: flex;
            position: relative;
            height: calc(100vh - var(--nav-height));
            overflow: hidden;
        }

        /* Video Grid Area */
        #video-grid-container {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: grid;
            gap: 1rem;
            align-content: center;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            #video-grid-container {
                grid-template-columns: 1fr;
                padding: 10px;
                padding-bottom: 80px;
            }
            .video-card { min-height: 250px; }
        }

        .video-card {
            position: relative;
            background: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
        }
        .video-card.speaking { border-color: var(--success); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .video-card.hand-raised { border-color: #fbbf24; }

        video { width: 100%; height: 100%; object-fit: cover; }
        
        .user-info {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px; border-radius: 20px;
            font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
            pointer-events: none;
        }
        .connection-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success);
        }
        .status-icons {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 5px;
        }
        .status-badge {
            background: rgba(0,0,0,0.6); color: white;
            padding: 5px; border-radius: 50%; width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center; font-size: 12px;
        }

        /* --- 4. CHAT SIDEBAR --- */
        #chat-panel {
            width: 320px;
            background: var(--bg-panel);
            border-left: 1px solid #334155;
            display: flex; flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        @media (max-width: 768px) {
            #chat-panel {
                position: absolute;
                top: 0; right: 0; width: 85%; height: 100%;
                transform: translateX(100%);
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }
            #chat-panel.open { transform: translateX(0); }
        }

        .chat-header { padding: 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #334155; padding: 8px 12px; border-radius: 8px; align-self: flex-start; max-width: 90%; word-break: break-word; font-size: 0.9rem; }
        .message.self { background: var(--primary); align-self: flex-end; }
        .msg-meta { font-size: 0.7rem; opacity: 0.7; margin-bottom: 2px; }
        .chat-input-area { padding: 15px; border-top: 1px solid #334155; display: flex; gap: 10px; }
        
        /* --- 5. CONTROLS BAR --- */
        #controls-bar {
            height: var(--nav-height);
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex; justify-content: center; align-items: center;
            gap: 15px;
            position: relative;
            z-index: 60;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .ctrl-btn {
            width: 50px; height: 50px; border-radius: 50%;
            border: none; background: #334155; color: white;
            font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn.active { background: var(--primary); }
        .ctrl-btn.off { background: var(--danger); }
        .ctrl-btn.leave { background: #ef4444; color: white; width: 60px; border-radius: 20px; }

        .hidden { display: none !important; }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; padding: 10px 20px; border-radius: 20px;
            z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }

        /* Kick Button */
        .kick-btn { background: var(--danger); border: none; color: white; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="toast">Notification</div>

    <div id="lobby-overlay">
        <div class="lobby-card">
            <h2 style="color: var(--primary); margin-top:0;"><i class="fas fa-video"></i> NexCall</h2>
            <div class="input-group">
                <label>Display Name</label>
                <input type="text" id="username" placeholder="e.g. John Doe">
            </div>
            <div class="input-group">
                <label>Room ID (Auto-generated if empty)</label>
                <input type="text" id="room-input" placeholder="e.g. daily-standup">
            </div>
            <button class="btn btn-primary" id="join-btn">Join / Create Room</button>
            <p id="lobby-msg" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <div id="video-grid-container">
            <div id="local-video-wrapper" class="video-card">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="user-info">
                    <span class="connection-dot"></span>
                    <span id="local-name-display">You</span>
                </div>
                <div class="status-icons" id="local-status"></div>
            </div>
        </div>

        <div id="chat-panel">
            <div class="chat-header">
                <span>Chat</span>
                <i class="fas fa-times" id="close-chat-mobile" style="cursor:pointer; display:none;"></i>
            </div>
            <div class="chat-messages" id="chat-feed"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-msg" placeholder="Type..." style="margin:0;">
                <button class="btn btn-primary" style="width: auto;" id="send-msg"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="controls-bar" class="hidden">
        <button class="ctrl-btn" id="mic-btn"><i class="fas fa-microphone"></i></button>
        <button class="ctrl-btn" id="cam-btn"><i class="fas fa-video"></i></button>
        <button class="ctrl-btn" id="hand-btn"><i class="fas fa-hand-paper"></i></button>
        <button class="ctrl-btn" id="invite-btn" title="Copy Invite Link"><i class="fas fa-link"></i></button>
        <button class="ctrl-btn" id="chat-toggle-btn"><i class="fas fa-comment-alt"></i></button>
        
        <button class="ctrl-btn hidden" id="admin-menu-btn" style="background: #eab308;"><i class="fas fa-crown"></i></button>
        
        <button class="ctrl-btn leave" id="leave-btn"><i class="fas fa-phone-slash"></i></button>
    </div>

    <dialog id="admin-modal" style="background: var(--bg-panel); color: white; border: 1px solid #444; border-radius: 12px; padding: 20px;">
        <h3>Admin Controls</h3>
        <button class="btn btn-primary" style="background: var(--danger); margin-bottom: 5px;" id="admin-mute-all">Mute Everyone</button>
        <button class="btn btn-primary" style="background: #444;" onclick="document.getElementById('admin-modal').close()">Close</button>
    </dialog>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { 
            getFirestore, collection, doc, setDoc, addDoc, onSnapshot, 
            updateDoc, deleteDoc, getDoc, serverTimestamp, query, orderBy, limit 
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Firebase Config (Apnar Dewa Details)
        const firebaseConfig = {
            apiKey: "AIzaSyB8rID7RGFq4iLkueeJsoYYyJ_aAh7qBHs",
            authDomain: "voice-call-demo-1201b.firebaseapp.com",
            projectId: "voice-call-demo-1201b",
            storageBucket: "voice-call-demo-1201b.firebasestorage.app",
            messagingSenderId: "611354192250",
            appId: "1:611354192250:web:bac02535d65ca6565fcec3",
            measurementId: "G-TDD0343N6G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const state = {
            localStream: null,
            uid: null,
            username: "Guest",
            roomId: null,
            isAdmin: false,
            audioEnabled: true,
            videoEnabled: true,
            handRaised: false
        };

        const els = {
            lobby: document.getElementById('lobby-overlay'),
            app: document.getElementById('app-container'),
            controls: document.getElementById('controls-bar'),
            videoGrid: document.getElementById('video-grid-container'),
            localVideo: document.getElementById('local-video'),
            chatPanel: document.getElementById('chat-panel'),
            chatFeed: document.getElementById('chat-feed'),
            micBtn: document.getElementById('mic-btn'),
            camBtn: document.getElementById('cam-btn'),
            handBtn: document.getElementById('hand-btn'),
            leaveBtn: document.getElementById('leave-btn'),
            adminBtn: document.getElementById('admin-menu-btn'),
            inviteBtn: document.getElementById('invite-btn')
        };

        // Parse Direct Invite Link
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            if(params.has('room')) document.getElementById('room-input').value = params.get('room');
        });

        document.getElementById('join-btn').onclick = async () => {
            const userIn = document.getElementById('username').value.trim();
            if(!userIn) return showToast("Enter a name");
            state.username = userIn;
            await signInAnonymously(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.uid = user.uid;
                state.roomId = document.getElementById('room-input').value.trim() || Math.random().toString(36).substr(2, 9);
                
                const roomRef = doc(db, "rooms", state.roomId);
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    state.isAdmin = true;
                    await setDoc(roomRef, { creator: state.uid, muteAllTrigger: 0 });
                } else if(roomSnap.data().creator === state.uid) {
                    state.isAdmin = true;
                }

                startCall();
            }
        });

        async function startCall() {
            state.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            els.localVideo.srcObject = state.localStream;
            
            els.lobby.classList.add('hidden');
            els.app.classList.remove('hidden');
            els.controls.classList.remove('hidden');
            document.getElementById('local-name-display').innerText = state.username + (state.isAdmin ? " (Admin)" : "");

            if(state.isAdmin) els.adminBtn.classList.remove('hidden');

            await setDoc(doc(db, "rooms", state.roomId, "participants", state.uid), {
                name: state.username,
                mic: true,
                hand: false
            });

            setupListeners();
        }

        function setupListeners() {
            // Kick Out Listener
            onSnapshot(doc(db, "rooms", state.roomId, "participants", state.uid), (snap) => {
                if(!snap.exists()) { alert("You have been kicked by Admin."); location.reload(); }
            });

            // Mute All Listener
            onSnapshot(doc(db, "rooms", state.roomId), (snap) => {
                const data = snap.data();
                if(data.muteAllTrigger > 0 && !state.isAdmin) {
                    const track = state.localStream.getAudioTracks()[0];
                    track.enabled = false;
                    state.audioEnabled = false;
                    els.micBtn.classList.add('off');
                    showToast("Admin muted everyone");
                }
            });

            // Participant Grid Sync
            onSnapshot(collection(db, "rooms", state.roomId, "participants"), (snap) => {
                snap.docChanges().forEach(change => {
                    const id = change.doc.id;
                    const data = change.doc.data();
                    if(id === state.uid) return;

                    if(change.type === "added") renderParticipant(id, data.name);
                    if(change.type === "removed") document.getElementById(`card-${id}`)?.remove();
                });
            });
        }

        function renderParticipant(id, name) {
            const div = document.createElement('div');
            div.className = 'video-card';
            div.id = `card-${id}`;
            div.innerHTML = `
                <video id="video-${id}" autoplay playsinline></video>
                <div class="user-info"><span>${name}</span></div>
                ${state.isAdmin ? `<button class="kick-btn" onclick="kickUser('${id}')">Kick User</button>` : ''}
            `;
            els.videoGrid.appendChild(div);
        }

        // Logic for Buttons
        window.kickUser = async (id) => {
            if(confirm("Kick this user?")) await deleteDoc(doc(db, "rooms", state.roomId, "participants", id));
        };

        els.inviteBtn.onclick = () => {
            const url = `${window.location.origin}${window.location.pathname}?room=${state.roomId}`;
            navigator.clipboard.writeText(url);
            showToast("Direct link copied!");
        };

        els.micBtn.onclick = () => {
            const track = state.localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            state.audioEnabled = track.enabled;
            els.micBtn.classList.toggle('off', !track.enabled);
        };

        els.camBtn.onclick = () => {
            const track = state.localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            els.camBtn.classList.toggle('off', !track.enabled);
        };

        els.chatToggleBtn.onclick = () => els.chatPanel.classList.toggle('open');
        els.adminBtn.onclick = () => document.getElementById('admin-modal').showModal();
        document.getElementById('admin-mute-all').onclick = async () => {
            await updateDoc(doc(db, "rooms", state.roomId), { muteAllTrigger: Math.random() });
            document.getElementById('admin-modal').close();
        };

        els.leaveBtn.onclick = () => location.reload();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 3000);
        }
    </script>
</body>
</html>
