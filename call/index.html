<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceHub Pro // Secure Rooms</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #475569;
            --glass: rgba(30, 41, 59, 0.8);
        }

footer, .footer-container { /* Apnar footer-er class name ekhane din */
    position: fixed;
    bottom: 20px; /* Nich theke 20px upore thakbe */
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000; /* Jate onno element-er upore thake */
}

        
        body {
    padding-bottom: 80px; /* Footer-er height ebong 20px gap mile jototuku lage */
    box-sizing: border-box;
}
        * { 
            box-sizing: border-box; 
            outline: none; 
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* --- COMMON UI --- */
        .hidden { display: none !important; }
        
        button {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 24px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        button:hover { 
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        button:active { transform: translateY(0); }
        
        button.secondary { background: var(--bg-tertiary); }
        button.secondary:hover { background: var(--border); }
        
        button.danger { background: var(--danger); }
        button.danger:hover { background: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        
        button.admin { background: var(--accent); }
        button.admin:hover { background: #db2777; }

        input, select {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            width: 100%;
            font-family: inherit;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            z-index: 10;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group button {
            padding: 12px 16px;
            flex-shrink: 0;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }

        .auth-status {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.guest { background: var(--danger); color: white; }
        .badge.admin { background: var(--accent); color: white; }

        /* --- MAIN APP --- */
        #app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Top Bar */
        #top-bar {
            height: 60px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: var(--primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: var(--bg-tertiary);
            font-size: 16px;
        }

        /* Main Content Area */
        #main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        #grid-container {
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            min-height: 100%;
        }

        @media (max-width: 768px) {
            #grid-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                padding: 12px;
            }
        }

        /* User Card */
        .user-node {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }

        .user-node:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .user-node.speaking { 
            border-color: var(--success);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.4);
        }

        .user-node.admin-user {
            border-top: 3px solid var(--accent);
        }
        
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .avatar {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }
        }
        
        .status-indicators {
            position: absolute;
            bottom: -4px;
            right: -4px;
            display: flex;
            gap: 4px;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            background: var(--bg-primary);
            border: 2px solid var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .status-icon.muted { color: var(--danger); }
        .status-icon.hand { 
            color: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: var(--text-secondary);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .admin-controls {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .user-node:hover .admin-controls {
            opacity: 1;
        }

        .mini-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            font-size: 11px;
            border-radius: 6px;
        }

        /* Bottom Controls */
        #control-deck {
            height: 80px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 20px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .control-btn.active {
            background: var(--success);
        }

        .control-btn.muted {
            background: var(--danger);
        }

        @media (max-width: 768px) {
            .control-btn {
                width: 52px;
                height: 52px;
                font-size: 18px;
            }
        }

        /* Chat Overlay */
        #chat-overlay {
            position: fixed;
            bottom: 96px;
            right: 16px;
            width: 360px;
            max-width: calc(100vw - 32px);
            height: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateY(calc(100% + 96px));
            transition: transform 0.3s ease;
        }

        #chat-overlay.open {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            #chat-overlay {
                bottom: 96px;
                right: 12px;
                width: calc(100vw - 24px);
                height: 350px;
            }
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        #chat-feed {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-sender {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
        }

        .chat-text {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input-area input {
            margin: 0;
        }

        .chat-input-area button {
            padding: 12px 20px;
            flex-shrink: 0;
        }

        /* Toast */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
        }

        @media (max-width: 768px) {
            #toast-container {
                left: 12px;
                right: 12px;
                max-width: none;
            }
        }

        .toast {
            background: var(--bg-secondary);
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }

        .toast-icon {
            font-size: 20px;
        }

        .toast-message {
            font-size: 13px;
            font-weight: 500;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Loading animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- 1. LOGIN / LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🎙️ VoiceHub Pro</h1>
                <p>Secure Group Voice Rooms</p>
            </div>
            
            <!-- Auth Status -->
            <div class="auth-status">
                <div>
                    <span style="color: var(--text-muted); font-size: 11px;">STATUS:</span>
                    <span class="badge guest" id="auth-badge">GUEST</span>
                </div>
                <button class="secondary" id="toggle-auth-btn" style="padding: 6px 12px; font-size: 12px;">
                    Admin Login
                </button>
            </div>

            <!-- Login Form (Hidden by default) -->
            <div id="login-form" class="hidden">
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="adm-email" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adm-pass" placeholder="••••••••">
                </div>
                <button class="admin" id="do-login-btn" style="width:100%">
                    <i class="fas fa-sign-in-alt"></i> Authenticate
                </button>
                <div class="divider"></div>
            </div>

            <!-- Join/Create Form -->
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="username" placeholder="Enter your name..." maxlength="12">
            </div>
            
            <div class="form-group">
                <label>🔑 Room ID</label>
                <div class="input-group">
                    <input type="text" id="room-id" placeholder="Ex: 8X92B">
                    <button class="secondary" id="gen-id-btn" title="Generate Random">
                        <i class="fas fa-dice"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>🔒 Security Level</label>
                <select id="security-level">
                    <option value="public">Public (Open)</option>
                    <option value="private">Private (Password Protected)</option>
                </select>
            </div>

            <div id="password-field" class="form-group hidden">
                <label>🗝️ Room Password</label>
                <input type="password" id="room-pass" placeholder="Enter password...">
            </div>

            <button id="connect-btn" style="width:100%; margin-top:8px;">
                <i class="fas fa-plug"></i> Connect to Room
            </button>
        </div>
    </div>

    <!-- 2. MAIN APP -->
    <div id="app-layout" class="hidden">
        <div id="top-bar">
            <div class="room-info">
                <div class="room-badge">
                    <i class="fas fa-satellite-dish"></i>
                    <span id="room-display">---</span>
                    <i class="fas fa-lock hidden" id="lock-icon" style="font-size: 12px;"></i>
                </div>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="copy-link" title="Copy Room ID">
                    <i class="fas fa-share-alt"></i>
                </button>
                <button class="icon-btn" id="toggle-chat" title="Toggle Chat">
                    <i class="fas fa-comment-alt"></i>
                </button>
            </div>
        </div>

        <div id="main-content">
            <div id="grid-container">
                <!-- User Nodes go here -->
            </div>
        </div>

        <div id="control-deck">
            <button class="control-btn active" id="mic-btn" title="Toggle Mic">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="control-btn active" id="sound-btn" title="Toggle Sound">
                <i class="fas fa-volume-up"></i>
            </button>
            <button class="control-btn" id="hand-btn" title="Raise Hand">
                <i class="fas fa-hand-paper"></i>
            </button>
            <button class="control-btn danger" id="leave-btn" title="Disconnect">
                <i class="fas fa-power-off"></i>
            </button>
        </div>

        <!-- Chat Overlay -->
        <div id="chat-overlay">
            <div class="chat-header">
                <h3>💬 Chat</h3>
                <button class="icon-btn" id="close-chat" style="width: 32px; height: 32px; font-size: 14px;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="chat-feed"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-msg" placeholder="Type a message...">
                <button id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, setDoc, getDoc, onSnapshot, 
            updateDoc, deleteDoc, serverTimestamp, query, orderBy, addDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        /* --- CONFIGURATION --- */
        const firebaseConfig = {
            apiKey: "AIzaSyB8rID7RGFq4iLkueeJsoYYyJ_aAh7qBHs",
            authDomain: "voice-call-demo-1201b.firebaseapp.com",
            projectId: "voice-call-demo-1201b",
            storageBucket: "voice-call-demo-1201b.firebasestorage.app",
            messagingSenderId: "611354192250",
            appId: "1:611354192250:web:bac02535d65ca6565fcec3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        /* --- STATE --- */
        let state = {
            localStream: null,
            pcs: {},
            uid: Math.random().toString(36).substr(2, 9),
            room: null,
            name: 'User',
            isAdmin: false,
            isMicOn: true,
            isDeaf: false,
            isHandRaised: false
        };

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        /* --- UI HANDLERS --- */
        
        // Auth Toggle
        document.getElementById('toggle-auth-btn').onclick = () => {
            document.getElementById('login-form').classList.toggle('hidden');
        };

        document.getElementById('do-login-btn').onclick = async () => {
            const e = document.getElementById('adm-email').value;
            const p = document.getElementById('adm-pass').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
                toast("Admin access granted", "success");
                document.getElementById('login-form').classList.add('hidden');
            } catch(err) { 
                toast("Access denied: " + err.code, "error"); 
            }
        };

        onAuthStateChanged(auth, user => {
            const badge = document.getElementById('auth-badge');
            if(user) {
                badge.textContent = 'ADMIN';
                badge.className = 'badge admin';
                state.isAdmin = true;
            } else {
                badge.textContent = 'GUEST';
                badge.className = 'badge guest';
                state.isAdmin = false;
            }
        });

        // Room Setup
        document.getElementById('gen-id-btn').onclick = () => {
            document.getElementById('room-id').value = Math.random().toString(36).substr(2, 6).toUpperCase();
        };

        document.getElementById('security-level').onchange = (e) => {
            if(e.target.value === 'private') {
                document.getElementById('password-field').classList.remove('hidden');
            } else {
                document.getElementById('password-field').classList.add('hidden');
            }
        };

        // Connect
        document.getElementById('connect-btn').onclick = async () => {
            const name = document.getElementById('username').value.trim();
            const room = document.getElementById('room-id').value.toUpperCase().trim();
            const type = document.getElementById('security-level').value;
            const pwd = document.getElementById('room-pass').value;

            if(!name || !room) return toast("Please fill all fields", "error");
            if(type === 'private' && !pwd) return toast("Password required", "error");

            state.name = name;
            state.room = room;

            const btn = document.getElementById('connect-btn');
            btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Connecting...';
            btn.disabled = true;
            
            try {
                state.localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                await joinRoom(room, type, pwd);
            } catch(e) {
                console.error(e);
                toast("Microphone access denied", "error");
                btn.innerHTML = '<i class="fas fa-plug"></i> Connect to Room';
                btn.disabled = false;
            }
        };

        /* --- CORE LOGIC --- */

        async function joinRoom(roomId, type, password) {
            const roomRef = doc(db, 'group_calls', roomId);
            const roomSnap = await getDoc(roomRef);

            let isRoomAdmin = false;

            if (!roomSnap.exists()) {
                const roomData = {
                    type: type,
                    password: type === 'private' ? password : null,
                    createdAt: serverTimestamp(),
                    adminUid: auth.currentUser ? auth.currentUser.uid : null
                };
                if(auth.currentUser) isRoomAdmin = true;
                await setDoc(roomRef, roomData);
                toast(`Room created (${type})`, "success");
            } else {
                const data = roomSnap.data();
                
                if (data.type === 'private' && data.password !== password) {
                    const btn = document.getElementById('connect-btn');
                    btn.innerHTML = '<i class="fas fa-plug"></i> Connect to Room';
                    btn.disabled = false;
                    return toast("Wrong password", "error");
                }

                if (auth.currentUser && data.adminUid === auth.currentUser.uid) {
                    isRoomAdmin = true;
                    toast("Welcome back, Commander", "success");
                }
            }

            state.isAdmin = isRoomAdmin;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            document.getElementById('room-display').innerText = roomId;
            if(type === 'private') document.getElementById('lock-icon').classList.remove('hidden');

            await setDoc(doc(db, 'group_calls', roomId, 'participants', state.uid), {
                name: state.name,
                micOn: true,
                handRaised: false,
                role: isRoomAdmin ? 'admin' : 'user',
                joinedAt: serverTimestamp()
            });

            addSelfToGrid();
            startListeners();
            
            window.addEventListener('beforeunload', () => leaveCall());
        }

        function startListeners() {
            // Participant Sync
            onSnapshot(collection(db, 'group_calls', state.room, 'participants'), snap => {
                snap.docChanges().forEach(change => {
                    const d = change.doc.data();
                    const pid = change.doc.id;
                    if(pid === state.uid) {
                        if(d.kicked) leaveCall(true);
                        if(d.mutedByAdmin && state.isMicOn) toggleMic(false);
                        return;
                    }
                    if(change.type === 'added') {
                        addPeerNode(pid, d);
                        connectPeer(pid, state.uid > pid);
                        toast(`${d.name} joined`);
                    }
                    if(change.type === 'modified') updatePeerNode(pid, d);
                    if(change.type === 'removed') {
                        removePeer(pid);
                        toast(`${d.name} left`, "warning");
                    }
                });
            });

            // Chat Sync
            const q = query(collection(db, 'group_calls', state.room, 'messages'), orderBy('timestamp'));
            onSnapshot(q, snap => {
                snap.docChanges().forEach(change => {
                    if(change.type === 'added') renderChat(change.doc.data());
                });
            });

            // Signaling
            onSnapshot(collection(db, 'group_calls', state.room, 'participants', state.uid, 'inbox'), snap => {
                snap.docChanges().forEach(change => {
                    if(change.type === 'added') handleSignal(change.doc.data(), change.doc.id);
                });
            });
        }

        /* --- WEBRTC --- */
        async function connectPeer(remoteId, initiator) {
            const pc = new RTCPeerConnection(rtcConfig);
            state.pcs[remoteId] = pc;

            state.localStream.getTracks().forEach(t => pc.addTrack(t, state.localStream));

            pc.ontrack = e => {
                const audio = document.getElementById(`audio-${remoteId}`);
                if(audio) {
                    audio.srcObject = e.streams[0];
                    visualizeAudio(e.streams[0], remoteId);
                }
            };

            pc.onicecandidate = e => {
                if(e.candidate) sendSignal(remoteId, { type: 'candidate', candidate: e.candidate.toJSON() });
            };

            if(initiator) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendSignal(remoteId, { type: 'offer', sdp: offer.sdp });
            }
        }

        async function handleSignal(data, docId) {
            deleteDoc(doc(db, 'group_calls', state.room, 'participants', state.uid, 'inbox', docId));

            const pc = state.pcs[data.from];
            if(!pc) return;

            if(data.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignal(data.from, { type: 'answer', sdp: answer.sdp });
            } else if (data.type === 'answer') {
                if(!pc.currentRemoteDescription) await pc.setRemoteDescription(new RTCSessionDescription(data));
            } else if (data.type === 'candidate') {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }

        async function sendSignal(target, payload) {
            payload.from = state.uid;
            await addDoc(collection(db, 'group_calls', state.room, 'participants', target, 'inbox'), payload);
        }

        /* --- UI RENDERING --- */
        const grid = document.getElementById('grid-container');

        function addSelfToGrid() {
            const div = document.createElement('div');
            div.className = `user-node ${state.isAdmin ? 'admin-user' : ''}`;
            div.id = 'node-self';
            div.innerHTML = `
                <div class="avatar">
                    ${state.name[0]}
                    <div class="status-indicators">
                        <div class="status-icon hand hidden" id="self-hand">✋</div>
                        <div class="status-icon muted hidden" id="self-mute">
                            <i class="fas fa-microphone-slash"></i>
                        </div>
                    </div>
                </div>
                <div class="user-name">${state.name} (You)</div>
            `;
            grid.appendChild(div);
            visualizeAudio(state.localStream, 'self');
        }

        function addPeerNode(id, data) {
            const div = document.createElement('div');
            div.className = `user-node ${data.role==='admin' ? 'admin-user' : ''}`;
            div.id = `node-${id}`;
            
            let adminBtns = '';
            if(state.isAdmin) {
                adminBtns = `
                    <div class="admin-controls">
                        <button class="mini-btn danger" onclick="window.kick('${id}')" title="Kick">
                            <i class="fas fa-user-times"></i>
                        </button>
                        <button class="mini-btn" onclick="window.mute('${id}')" title="Mute">
                            <i class="fas fa-microphone-slash"></i>
                        </button>
                    </div>
                `;
            }

            div.innerHTML = `
                ${adminBtns}
                <div class="avatar">
                    ${data.name[0]}
                    <div class="status-indicators">
                        <div class="status-icon hand ${data.handRaised?'':'hidden'}" id="hand-${id}">✋</div>
                        <div class="status-icon muted ${data.micOn?'hidden':''}" id="mute-${id}">
                            <i class="fas fa-microphone-slash"></i>
                        </div>
                    </div>
                </div>
                <div class="user-name">${data.name}</div>
                <audio id="audio-${id}" autoplay></audio>
            `;
            grid.appendChild(div);
        }

        function updatePeerNode(id, data) {
            const node = document.getElementById(`node-${id}`);
            if(!node) return;
            
            const mIcon = document.getElementById(`mute-${id}`);
            if(mIcon) {
                if(data.micOn) mIcon.classList.add('hidden'); 
                else mIcon.classList.remove('hidden');
            }

            const hIcon = document.getElementById(`hand-${id}`);
            if(hIcon) {
                if(data.handRaised) hIcon.classList.remove('hidden'); 
                else hIcon.classList.add('hidden');
            }
        }

        function removePeer(id) {
            const el = document.getElementById(`node-${id}`);
            if(el) el.remove();
            if(state.pcs[id]) { 
                state.pcs[id].close(); 
                delete state.pcs[id]; 
            }
        }

        function visualizeAudio(stream, id) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaStreamSource(stream);
            const anl = ctx.createAnalyser();
            anl.fftSize = 64;
            src.connect(anl);
            const data = new Uint8Array(anl.frequencyBinCount);
            
            const loop = () => {
                const el = document.getElementById(id === 'self' ? 'node-self' : `node-${id}`);
                if(!el) return;
                anl.getByteFrequencyData(data);
                const vol = data.reduce((a,b)=>a+b)/data.length;
                if(vol > 20) el.classList.add('speaking');
                else el.classList.remove('speaking');
                requestAnimationFrame(loop);
            }
            loop();
        }

        /* --- CONTROLS --- */
        
        document.getElementById('mic-btn').onclick = () => toggleMic();
        async function toggleMic(force) {
            state.isMicOn = force !== undefined ? force : !state.isMicOn;
            state.localStream.getAudioTracks()[0].enabled = state.isMicOn;
            
            const btn = document.getElementById('mic-btn');
            const icon = document.getElementById('self-mute');
            
            if(state.isMicOn) {
                btn.classList.add('active');
                btn.classList.remove('muted');
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
                icon.classList.add('hidden');
            } else {
                btn.classList.remove('active');
                btn.classList.add('muted');
                btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                icon.classList.remove('hidden');
            }
            
            await updateDoc(doc(db, 'group_calls', state.room, 'participants', state.uid), { micOn: state.isMicOn });
        }

        document.getElementById('sound-btn').onclick = () => {
            state.isDeaf = !state.isDeaf;
            const btn = document.getElementById('sound-btn');
            document.querySelectorAll('audio').forEach(a => a.muted = state.isDeaf);
            
            if(!state.isDeaf) {
                btn.classList.add('active');
                btn.classList.remove('muted');
                btn.innerHTML = '<i class="fas fa-volume-up"></i>';
                toast("Audio enabled");
            } else {
                btn.classList.remove('active');
                btn.classList.add('muted');
                btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                toast("Audio muted", "warning");
            }
        };

        document.getElementById('hand-btn').onclick = async () => {
            state.isHandRaised = !state.isHandRaised;
            const btn = document.getElementById('hand-btn');
            const icon = document.getElementById('self-hand');
            
            if(state.isHandRaised) {
                btn.classList.add('active');
                icon.classList.remove('hidden');
                toast("Hand raised");
            } else {
                btn.classList.remove('active');
                icon.classList.add('hidden');
            }
            
            await updateDoc(doc(db, 'group_calls', state.room, 'participants', state.uid), { handRaised: state.isHandRaised });
        };

        document.getElementById('leave-btn').onclick = () => leaveCall();

        async function leaveCall(kicked = false) {
            if(state.room) {
                await deleteDoc(doc(db, 'group_calls', state.room, 'participants', state.uid));
            }
            if(kicked) alert("You were removed by the admin");
            window.location.reload();
        }

        /* --- ADMIN --- */
        window.kick = async (id) => {
            if(!confirm("Remove this user?")) return;
            await updateDoc(doc(db, 'group_calls', state.room, 'participants', id), { kicked: true });
        };

        window.mute = async (id) => {
            await updateDoc(doc(db, 'group_calls', state.room, 'participants', id), { mutedByAdmin: true });
            toast("User muted");
        };

        /* --- CHAT --- */
        const chatOverlay = document.getElementById('chat-overlay');
        
        document.getElementById('toggle-chat').onclick = () => {
            chatOverlay.classList.toggle('open');
        };

        document.getElementById('close-chat').onclick = () => {
            chatOverlay.classList.remove('open');
        };

        document.getElementById('send-btn').onclick = sendChat;
        document.getElementById('chat-msg').onkeypress = e => { 
            if(e.key === 'Enter') sendChat() 
        };

        async function sendChat() {
            const txt = document.getElementById('chat-msg').value.trim();
            if(!txt) return;
            
            await addDoc(collection(db, 'group_calls', state.room, 'messages'), {
                sender: state.name,
                text: txt,
                timestamp: serverTimestamp()
            });
            
            document.getElementById('chat-msg').value = '';
        }

        function renderChat(data) {
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `
                <div class="chat-sender">${data.sender}</div>
                <div class="chat-text">${data.text}</div>
            `;
            
            const feed = document.getElementById('chat-feed');
            feed.appendChild(div);
            feed.scrollTop = feed.scrollHeight;
        }

        document.getElementById('copy-link').onclick = () => {
            navigator.clipboard.writeText(state.room);
            toast("Room ID copied!");
        };

        /* --- TOAST --- */
        function toast(msg, type='info') {
            const icons = {
                info: '💡',
                success: '✅',
                error: '❌',
                warning: '⚠️'
            };

            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.info}</div>
                <div class="toast-message">${msg}</div>
            `;
            
            document.getElementById('toast-container').appendChild(t);
            
            setTimeout(() => {
                t.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

    </script>
</body>
</html>
