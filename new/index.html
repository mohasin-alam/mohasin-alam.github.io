<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_SHELL v3.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020202">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #020202;
            --bg-panel: #0d0d0d;
            --bg-hover: #1a1a1a;
            --neon-green: #0f0;
            --neon-dim: #004d00;
            --neon-red: #ff003c;
            --neon-blue: #00f3ff;
            --border-color: #333;
            --font-stack: 'Fira Code', monospace;
            --sidebar-width: 380px; 
        }

        /* Base Reset */
        * { box-sizing: border-box; outline: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--neon-dim); }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--neon-green);
            font-family: var(--font-stack);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* CRT Effect Overlay */
        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* Animations */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes glitch { 
            0% { text-shadow: 2px 0 var(--neon-red), -2px 0 var(--neon-blue); } 
            25% { text-shadow: -2px 0 var(--neon-red), 2px 0 var(--neon-blue); } 
            50% { text-shadow: 2px 0 var(--neon-red), -2px 0 var(--neon-blue); } 
            100% { text-shadow: none; }
        }

        /* Auth Screen */
        #auth-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            width: 400px; padding: 40px;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            background: rgba(0, 20, 0, 0.9);
            text-align: center; position: relative;
        }
        .login-input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: black; border: 1px solid var(--neon-dim);
            color: var(--neon-green); font-family: var(--font-stack);
            font-size: 1rem; transition: 0.3s;
        }

        /* Main App Layout */
        #app-layer { display: none; width: 100%; height: 100%; flex-direction: column; }
        header {
            height: 50px; border-bottom: 2px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: var(--bg-panel);
        }
        .brand { font-weight: 600; font-size: 1.2rem; letter-spacing: 2px; cursor: pointer; }
        .btn {
            background: transparent; border: 1px solid var(--neon-dim);
            color: var(--neon-green); padding: 5px 15px; margin-left: 5px;
            cursor: pointer; font-family: var(--font-stack); text-transform: uppercase;
            font-size: 0.8rem; transition: 0.2s;
        }
        .btn:hover { background: var(--neon-green); color: black; box-shadow: 0 0 15px var(--neon-green); }
        
        .workspace { display: flex; flex: 1; overflow: hidden; }
        aside { width: var(--sidebar-width); background: var(--bg-panel); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; transition: 0.3s; }
        .notes-list { flex: 1; overflow-y: auto; }
        .note-item { padding: 15px 20px; border-bottom: 1px solid #111; cursor: pointer; transition: 0.2s; }
        .note-item.active { background: rgba(0, 255, 0, 0.05); border-right: 4px solid var(--neon-green); }

        main { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); }
        #doc-title { width: 100%; padding: 15px 30px; background: transparent; border: none; color: var(--neon-green); font-family: var(--font-stack); font-size: 1.4rem; border-bottom: 1px dashed #333; }
        #doc-body { flex: 1; padding: 30px; background: transparent; border: none; color: #ccc; font-family: var(--font-stack); font-size: 1rem; line-height: 1.6; resize: none; }
        
        .status-bar { height: 30px; background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 0.75rem; }

        /* Alert System */
        #alert-system { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .terminal-alert { min-width: 300px; padding: 15px; background: rgba(0,0,0,0.95); border: 1px solid; font-family: var(--font-stack); animation: slideIn 0.3s ease-out; display: flex; align-items: center; }
        .alert-error { border-color: var(--neon-red); color: var(--neon-red); }
        .alert-success { border-color: var(--neon-green); color: var(--neon-green); }

        @media (max-width: 768px) {
            aside { position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); width: 100%; }
            aside.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="crt">

    <div id="auth-layer">
        <div class="login-box">
            <h2 style="color: var(--neon-green); margin-bottom: 5px;">:: SYSTEM ACCESS ::</h2>
            <p style="color: #666; font-size: 0.8rem; margin-bottom: 20px;">AUTHENTICATION REQUIRED</p>
            <input type="email" id="email" class="login-input" placeholder="USER_ID">
            <input type="password" id="pass" class="login-input" placeholder="ACCESS_KEY">
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn" onclick="authAction('login')" style="flex:1">LOGIN</button>
                <button class="btn" onclick="authAction('signup')" style="flex:1; border-color: var(--neon-blue); color: var(--neon-blue)">INIT NEW</button>
            </div>
            <p onclick="resetPass()" style="margin-top:15px; font-size:0.7rem; cursor:pointer; text-decoration:underline; opacity: 0.6;">LOST CREDENTIALS?</p>
        </div>
    </div>

    <div id="app-layer">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn" onclick="toggleSidebar()" id="menu-btn" style="display:none; border:none; font-size:1.2rem;">≡</button>
                <div class="brand" onclick="toggleFullScreen()"><i class="fas fa-terminal"></i> GHOST_SHELL</div>
            </div>
            <div>
                <button class="btn" onclick="createNewNote()"><i class="fas fa-plus"></i> NEW</button>
                <button class="btn btn-danger" onclick="logout()"><i class="fas fa-power-off"></i> EXIT</button>
            </div>
        </header>

        <div class="workspace">
            <aside id="sidebar">
                <div style="padding:15px; font-size:0.7rem; border-bottom:1px solid #222;">
                    STATUS: <span id="sync-status" style="color:var(--neon-blue)">SYNCING...</span>
                </div>
                <div class="notes-list" id="notes-list"></div>
            </aside>

            <main>
                <input type="text" id="doc-title" placeholder="UNTITLED_DOCUMENT">
                <textarea id="doc-body" placeholder="Begin secure data entry..."></textarea>
                <input type="hidden" id="current-id">
            </main>
        </div>

        <div class="status-bar">
            <span id="word-count">WORDS: 0</span>
            <span id="save-indicator">[READY]</span>
            <span id="clock-display">00:00:00</span>
        </div>
    </div>

    <div id="alert-system"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJDYv3qR88OcpR5Jfm_rMd8z9WZPYqWjw",
            authDomain: "notepad-c5b98.firebaseapp.com",
            databaseURL: "https://notepad-c5b98-default-rtdb.firebaseio.com",
            projectId: "notepad-c5b98",
            storageBucket: "notepad-c5b98.firebasestorage.app",
            messagingSenderId: "737040022800",
            appId: "1:737040022800:web:5e5eb1971ccadf6d753995"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        // Offline Persistence Enabled
        db.ref().keepSynced(true);

        let currentUser = null;
        let autoSaveTimer;

        // Service Worker Register
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        function terminalAlert(msg, type = 'success') {
            const container = document.getElementById('alert-system');
            const alertBox = document.createElement('div');
            alertBox.className = `terminal-alert alert-${type}`;
            alertBox.innerHTML = `<div><strong>:: MSG ::</strong> ${msg.toUpperCase()}</div>`;
            container.appendChild(alertBox);
            setTimeout(() => { alertBox.style.opacity = '0'; setTimeout(() => alertBox.remove(), 300); }, 3000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function authAction(action) {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            if (action === 'login') auth.signInWithEmailAndPassword(e, p).catch(err => terminalAlert(err.message, 'error'));
            else auth.createUserWithEmailAndPassword(e, p).catch(err => terminalAlert(err.message, 'error'));
        }

        function resetPass() {
            const e = document.getElementById('email').value;
            if(!e) return terminalAlert("Email Required", 'error');
            auth.sendPasswordResetEmail(e).then(() => terminalAlert("Reset Link Sent", 'success'));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user.uid;
                document.getElementById('auth-layer').style.display = 'none';
                document.getElementById('app-layer').style.display = 'flex';
                loadNotes();
            } else {
                document.getElementById('auth-layer').style.display = 'flex';
                document.getElementById('app-layer').style.display = 'none';
            }
        });

        function loadNotes() {
            db.ref(`notes/${currentUser}`).on('value', snap => {
                const list = document.getElementById('notes-list');
                list.innerHTML = '';
                const data = snap.val();
                if (data) {
                    Object.entries(data).reverse().forEach(([id, note]) => {
                        const div = document.createElement('div');
                        div.className = 'note-item';
                        div.innerHTML = `<div class="note-title">${note.title || 'UNTITLED'}</div>`;
                        div.onclick = () => {
                            document.getElementById('current-id').value = id;
                            document.getElementById('doc-title').value = note.title;
                            document.getElementById('doc-body').value = note.text;
                        };
                        list.appendChild(div);
                    });
                }
            });
        }

        function saveNote() {
            if (!currentUser) return;
            const id = document.getElementById('current-id').value;
            const title = document.getElementById('doc-title').value;
            const text = document.getElementById('doc-body').value;
            if(!title && !text) return;

            const payload = { title, text, timestamp: Date.now() };
            if (id) db.ref(`notes/${currentUser}/${id}`).update(payload);
            else {
                const newRef = db.ref(`notes/${currentUser}`).push();
                newRef.set(payload);
                document.getElementById('current-id').value = newRef.key;
            }
            document.getElementById('save-indicator').innerText = "[SAVED]";
        }

        document.getElementById('doc-title').oninput = triggerSave;
        document.getElementById('doc-body').oninput = triggerSave;

        function triggerSave() {
            document.getElementById('save-indicator').innerText = "[TYPING...]";
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveNote, 1500);
        }

        function createNewNote() {
            document.getElementById('current-id').value = '';
            document.getElementById('doc-title').value = '';
            document.getElementById('doc-body').value = '';
            document.getElementById('doc-title').focus();
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        
        setInterval(() => { document.getElementById('clock-display').innerText = new Date().toLocaleTimeString(); }, 1000);
        
        // Shortcut Ctrl+S
        document.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNote(); } });
    </script>
</body>
</html>
