<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট স্ক্রিনশট টিকার - টার্মিনাল স্টাইল</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        /* গ্লোবাল স্টাইলস */
        body {
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            background-color: #0d1117; 
            color: #00ff00; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* টার্মিনাল কন্টেইনার */
        .terminal-container {
            max-width: 900px;
            width: 100%;
            background-color: #1a1a1a; 
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); 
            padding: 20px;
            box-sizing: border-box;
        }

        /* শিরোনাম */
        h1, h2 {
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
        }
        h2 {
            margin-top: 30px;
            font-size: 1.3em;
        }

        /* ইনপুট ফিল্ড এবং বাটন */
        input[type="url"] {
            background-color: #222;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Roboto Mono', monospace;
            font-size: 1em;
            box-sizing: border-box;
            width: 100%; 
            margin-bottom: 15px;
            outline: none;
        }
        input[type="url"]:focus {
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        button {
            background-color: #008000; 
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Roboto Mono', monospace;
            font-size: 1em;
            width: 100%;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #00b300;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }

        /* স্ট্যাটাস মেসেজ */
        #status {
            margin-top: 10px;
            padding: 8px;
            border-left: 3px solid;
            margin-bottom: 20px;
            color: #eee; 
        }
        .success { border-color: #00ff00; color: #00ff00; }
        .error { border-color: #ff0000; color: #ff0000; }
        .info { border-color: #00ffff; color: #00ffff; }

        /* স্ক্রিনশট সাইজ অপশনস */
        .size-options {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px dashed #00ff00;
            border-radius: 4px;
        }
        .size-options label {
            margin-right: 15px;
            color: #eee;
            cursor: pointer;
        }
        .size-options input[type="radio"] {
            accent-color: #00ff00;
            margin-right: 5px;
        }
        
        /* কাস্টম সাইজ ডিসপ্লে */
        #customSizeDisplay {
            color: #ffcc00;
            font-size: 0.9em;
            margin-left: 10px;
        }

        /* ইমেজ আউটপুট */
        #screenshotOutput { 
            padding: 10px; 
            border: 1px solid #00ff00; 
            border-radius: 4px; 
            background-color: #0a0a0a; 
            text-align: center;
        }
        #screenshotOutput img {
            max-width: 100%;
            height: auto;
            border: 2px dashed #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }

        /* Custom Modal CSS (Hacker Terminal Style) */
        .modal-terminal {
            display: none; 
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(2px);
            padding-top: 50px;
        }

        .modal-content-terminal {
            background-color: #1a1a1a;
            color: #00ff00;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #00ff00; 
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            font-family: 'Roboto Mono', monospace;
            animation: modal-open 0.4s ease-out;
        }

        @keyframes modal-open {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn-terminal {
            color: #ff0000;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn-terminal:hover,
        .close-btn-terminal:focus {
            color: #ffcccc;
            text-decoration: none;
        }

        .input-group-terminal {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        .input-group-terminal input {
            background-color: #0a0a0a;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 10px;
            font-family: 'Roboto Mono', monospace;
            width: 45%;
            text-align: center;
            outline: none;
        }

        .separator-terminal {
            margin: 0 5px;
            color: #00ffff;
        }
        
        #setCustomSizeBtn {
            width: 100%;
            background-color: #008000;
        }
        
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1>[ Screenshot-Taker@Terminal ]</h1>
        <p>Enter the URL and choose the screenshot size.</p>

        <input type="url" id="websiteUrl" placeholder=">> Enter website URL (e.g., https://google.com)" required>
        
        <div class="size-options">
            <label>
                <input type="radio" name="screenshotSize" value="desktop" checked> 
                Desktop (1024x768)
            </label>
            <label>
                <input type="radio" name="screenshotSize" value="mobile"> 
                Mobile (480x800)
            </label>
            <label>
                <input type="radio" name="screenshotSize" value="custom" id="customRadio"> 
                Custom 
                <span id="customSizeDisplay"> (1024x768)</span>
            </label>
        </div>
        
        <button id="captureButton">>>> CAPTURE SCREENSHOT</button>

        <div id="status" class="info">Status: Ready.</div>

        <h2>[ Screenshot-Output ]</h2>
        <div id="screenshotOutput">
            <p>Screenshot will appear here.</p>
        </div>
    </div>
    
    <div id="customSizeModal" class="modal-terminal">
        <div class="modal-content-terminal">
            <span class="close-btn-terminal">&times;</span>
            <h3>[ Custom Dimension Input ]</h3>
            <p>Enter required width and height (e.g., 1280x900):</p>
            <div class="input-group-terminal">
                <input type="number" id="customWidth" placeholder="Width (px)" min="100">
                <span class="separator-terminal">X</span>
                <input type="number" id="customHeight" placeholder="Height (px)" min="100">
            </div>
            <button id="setCustomSizeBtn">SET DIMENSION</button>
            <p id="modalStatus" style="color: red; font-size: 0.9em; margin-top: 10px;"></p>
        </div>
    </div>


    <script>
        // ⭐ API Key এবং ডিফল্ট সেটিংস
        const API_KEY = "fbc5e7"; 
        const API_BASE_URL = "https://api.screenshotmachine.com";
        let IMAGE_DIMENSION = "1024x768"; // ডিফল্ট মান
        
        // মোডাল এলিমেন্টস
        const modal = document.getElementById("customSizeModal");
        const customRadio = document.getElementById("customRadio");
        const closeModal = document.querySelector(".close-btn-terminal");
        const setCustomSizeBtn = document.getElementById("setCustomSizeBtn");
        const customWidthInput = document.getElementById("customWidth");
        const customHeightInput = document.getElementById("customHeight");
        const customSizeDisplay = document.getElementById("customSizeDisplay");
        const modalStatus = document.getElementById("modalStatus");
        const statusMessage = document.getElementById('status');

        
        // মোডাল খোলার ইভেন্ট
        customRadio.addEventListener('change', () => {
            if (customRadio.checked) {
                modalStatus.textContent = '';
                modal.style.display = "block";
            }
        });

        // মোডাল বন্ধ করার ইভেন্ট (X বাটন)
        closeModal.onclick = function() {
            modal.style.display = "none";
            // কাস্টম ক্যান্সেল হলে ডেস্কটপে ফেরত
            document.querySelector('input[value="desktop"]').checked = true;
            IMAGE_DIMENSION = "1024x768";
            customSizeDisplay.textContent = " (1024x768)";
            statusMessage.textContent = `Status: Size set to ${IMAGE_DIMENSION}.`;
            statusMessage.className = 'info';
        }

        // মোডাল বন্ধ করার ইভেন্ট (বাইরে ক্লিক)
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal.onclick(); // closeModal ফাংশন কল করা হলো
            }
        }
        
        // ⭐ কাস্টম সাইজ সেট করার লজিক
        setCustomSizeBtn.onclick = function() {
            const width = parseInt(customWidthInput.value);
            const height = parseInt(customHeightInput.value);

            if (isNaN(width) || isNaN(height) || width < 100 || height < 100) {
                modalStatus.textContent = "Error: Invalid or zero dimensions (Min 100x100).";
                return;
            }

            // সফল হলে ডাইমেনশন আপডেট
            IMAGE_DIMENSION = `${width}x${height}`;
            customSizeDisplay.textContent = ` (${IMAGE_DIMENSION})`;
            modalStatus.textContent = "Success! Dimension set.";
            modal.style.display = "none";
            
            // স্ট্যাটাস বার আপডেট
            statusMessage.textContent = `Status: Size set to ${IMAGE_DIMENSION}.`;
            statusMessage.className = 'info';
        }
        
        // রেডিও বাটন পরিবর্তনের ইভেন্ট
        document.querySelectorAll('input[name="screenshotSize"]').forEach(radio => {
            radio.addEventListener('change', (event) => {
                const selectedValue = event.target.value;
                if (selectedValue === 'desktop') {
                    IMAGE_DIMENSION = "1024x768";
                } else if (selectedValue === 'mobile') {
                    IMAGE_DIMENSION = "480x800";
                }
                
                // কাস্টম হলে মোডাল লজিক, অন্যথায় স্ট্যাটাস আপডেট
                if (selectedValue !== 'custom') {
                    customSizeDisplay.textContent = ` (${IMAGE_DIMENSION})`;
                    statusMessage.textContent = `Status: Size set to ${IMAGE_DIMENSION}.`;
                    statusMessage.className = 'info';
                }
            });
        });


        // ক্যাপচার বাটন ক্লিক লজিক (আগের মতোই)
        document.getElementById('captureButton').addEventListener('click', async () => {
            const urlInput = document.getElementById('websiteUrl').value;
            const screenshotOutput = document.getElementById('screenshotOutput');
            
            statusMessage.className = 'info';
            statusMessage.textContent = "Status: Initializing capture...";
            screenshotOutput.innerHTML = '<p>Processing...</p>'; 

            if (!urlInput) {
                statusMessage.className = 'error';
                statusMessage.textContent = "Error: Please enter a valid URL.";
                return;
            }

            statusMessage.className = 'info';
            statusMessage.textContent = "Status: Generating API link and loading image...";
            
            try {
                const encodedUrl = encodeURIComponent(urlInput);

                const screenshotApiLink = `${API_BASE_URL}?key=${API_KEY}&url=${encodedUrl}&dimension=${IMAGE_DIMENSION}`;
                
                screenshotOutput.innerHTML = '';
                const img = document.createElement('img');
                img.src = screenshotApiLink; 
                img.alt = `Screenshot of ${urlInput} at ${IMAGE_DIMENSION}`;
                
                img.onload = function() {
                    statusMessage.className = 'success'; 
                    statusMessage.textContent = `Success: Screenshot captured at ${IMAGE_DIMENSION} and displayed!`;
                };

                img.onerror = function() {
                    statusMessage.className = 'error';
                    screenshotOutput.innerHTML = '<p style="color: red;">Error: Failed to load image. Check the URL or API Key status.</p>';
                    statusMessage.textContent = `Error: Screenshot API failed to return the image. (Possible invalid URL or API issue)`;
                };
                
                screenshotOutput.appendChild(img);


            } catch (error) {
                console.error("General Error:", error);
                statusMessage.className = 'error'; 
                statusMessage.textContent = `Error: An unexpected error occurred.`;
                screenshotOutput.innerHTML = `<p style="color: red;">Process failed. Check console for details.</p>`;
            }
        });
    </script>

</body>
</html>
